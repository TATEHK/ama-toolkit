<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1713">
<link rel="icon" href="../../icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="../../icons/ama-apple-touch.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="../../config.js"></script>
<script src="../../hub-signin.js"></script>
<script src="../../idle-logout.js"></script>
<title>Grading Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#0f1713; --panel:#15201a; --raise:#1b2821; --ink:#edf2ee; --ink-2:#a3b5a9; --ink-3:#74897b;
  --line:#253629; --line-2:#31473a; --accent:#f5c518; --accent-ink:#14130a;
  --ok:#2f9e5b; --ok-text:#7fd6a2; --bad:#ef8a73; --bad-bg:#3a1f19; --warn:#f0b45a; --info:#7fb5f0;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --body:Barlow,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--raise);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:#173a26;color:var(--ok-text)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.warn{background:#3a2e17;color:var(--warn)} .tag.now{background:var(--accent);color:var(--accent-ink)}
/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--display);flex:none}
.brand b{font:700 17px var(--display);display:block;line-height:1.1} .brand small{color:var(--ink-3);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.clock{font:700 20px var(--display);color:var(--ink-2);min-width:70px;text-align:right}
main{padding:16px;max-width:1400px;margin:0 auto}
/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px} .field label{font-size:13px;font-weight:700;color:var(--ink-2)}
/* run of day */
.run{display:grid;grid-template-columns:320px 1fr;gap:16px}
@media (max-width:900px){.run{grid-template-columns:1fr}}
.blist{display:flex;flex-direction:column;gap:6px}
.bitem{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 11px;width:100%}
.bitem .t{font:700 15px var(--display);color:var(--ink-2);min-width:46px}
.bitem.now{border-color:var(--accent)} .bitem.done{opacity:.6}
.bitem b{display:block;font-size:15px}
.now-card h2{font-size:34px;line-height:1.05}
.train{font-size:22px;line-height:1.35;margin:10px 0}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.step{border:1px solid var(--line-2);background:var(--bg);border-radius:12px;padding:8px 12px;text-align:left;min-width:150px}
.step.on{border-color:var(--accent);background:#2a2610}
.step.done{opacity:.55}
.step b{display:block;font-size:14px} .step span{font-size:12px;color:var(--ink-2)}
.timer{font:700 64px/1 var(--display);letter-spacing:.02em}
.timer.over{color:var(--bad)} .timer.soon{color:var(--warn)}
.items{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.item{display:flex;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.item code{font:700 13px var(--display);color:var(--accent);min-width:48px}
/* roll call */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.who{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.who.on{border-color:var(--ok);background:#13291d}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.who.on .dot{background:var(--ok);border-color:var(--ok);color:#fff}
/* scoring */
.srow{display:grid;grid-template-columns:minmax(170px,240px) 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.srow.absent{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line-2);background:var(--bg);border-radius:10px;padding:6px 9px;min-width:64px;text-align:center;font-weight:700;font-size:13px;position:relative}
.chip small{display:block;font-size:10px;font-weight:600;color:var(--ink-3)}
.chip.pass{background:#173a26;border-color:var(--ok);color:var(--ok-text)}
.chip.fail{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip .c{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--info)}
.legend{display:flex;flex-direction:column;gap:4px;margin:8px 0 12px}
@media (max-width:700px){.srow{grid-template-columns:1fr}}
/* quiz host */
.qz{min-height:calc(100vh - 140px);display:flex;flex-direction:column;gap:16px}
.qz.tv{position:fixed;inset:0;z-index:50;background:var(--bg);padding:3vh 4vw;min-height:100vh}
.qz .qtext{font:700 clamp(28px,4.4vw,64px)/1.12 var(--display)}
.qz .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qz .opt{border-radius:16px;padding:18px 22px;font:700 clamp(20px,2.6vw,38px)/1.15 var(--display);display:flex;gap:14px;align-items:center;color:#fff;min-height:90px}
.qz .opt i{font-style:normal;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 12px}
.qz .o0{background:#c0392b}.qz .o1{background:#2e6fd8}.qz .o2{background:#c99a06}.qz .o3{background:#1f8f4e}
.qz .opt.dim{opacity:.25} .qz .opt.right{outline:6px solid #fff}
.qz .bar2{height:10px;background:rgba(255,255,255,.35);border-radius:6px;margin-top:6px}
.qz .meta{display:flex;justify-content:space-between;align-items:center;gap:16px;font:700 clamp(16px,1.8vw,26px) var(--display);color:var(--ink-2)}
.ring{font:700 clamp(40px,6vw,96px)/1 var(--display);color:var(--accent);min-width:2ch;text-align:right}
.fact{font-size:clamp(18px,2vw,30px);background:var(--panel);border-left:6px solid var(--accent);padding:14px 18px;border-radius:10px}
.lb{display:flex;flex-direction:column;gap:8px;max-width:900px;width:100%;margin:0 auto}
.lb .r{display:flex;gap:16px;align-items:center;background:var(--panel);border-radius:14px;padding:12px 18px;font:700 clamp(18px,2.2vw,32px) var(--display)}
.lb .r .n{color:var(--accent);min-width:2ch}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;margin-top:4vh}
.podium > div{background:var(--panel);border-radius:16px 16px 0 0;text-align:center;padding:16px;width:22vw;font:700 clamp(18px,2.4vw,34px) var(--display)}
.podium .p1{height:42vh;border-top:8px solid var(--accent)} .podium .p2{height:32vh;border-top:8px solid #c0c7cf} .podium .p3{height:24vh;border-top:8px solid #c98a4b}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center}
.lobby .qr{background:#fff;padding:16px;border-radius:16px;width:min(38vh,360px)} .lobby .qr svg{width:100%;height:auto;display:block}
.joined{display:flex;flex-wrap:wrap;gap:8px}
.joined span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--ink-3)}
.joined span.in{background:#173a26;border-color:var(--ok);color:var(--ok-text)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qz.tv .ctl{position:fixed;right:14px;bottom:14px;opacity:.15;transition:opacity .2s}
.qz.tv .ctl:hover,.qz.tv .ctl:focus-within{opacity:1}
.olist{display:flex;flex-direction:column;gap:10px}
.olist div{background:var(--panel);border-radius:12px;padding:12px 16px;font:700 clamp(18px,2.2vw,32px) var(--display)}
/* MC */
.mc{display:grid;grid-template-columns:1fr 360px;gap:16px}
@media (max-width:900px){.mc{grid-template-columns:1fr}}
.mc .big h2{font-size:40px;line-height:1.05}
.mc .big .sub{font:700 30px var(--display);color:var(--accent);margin-top:6px}
.alist{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}
.aitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 9px;font-size:14px;text-align:left;width:100%}
.aitem.now{border-color:var(--accent)} .aitem.done{opacity:.5}
/* results */
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;font-size:14px}
th{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
/* sheet */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:16px;padding:18px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:100;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
@media print{.bar,.noprint{display:none!important} body{background:#fff;color:#000} .card{border-color:#ccc;background:#fff}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="card">
    <div class="row"><div class="logo">A</div><div><h1 style="font-size:24px">Grading Event</h1><p id="gateMsg" class="muted small" style="margin:0">Loading…</p></div></div>
    <form id="siForm" hidden>
      <div class="field"><label for="siEmail">Email</label><input id="siEmail" type="email" autocomplete="username" required></div>
      <div class="field" style="margin-top:8px"><label for="siPass">Password</label><input id="siPass" type="password" autocomplete="current-password" required></div>
      <p id="siErr" class="small" style="color:var(--bad)" hidden></p>
      <button class="btn primary" id="siGo" type="submit" style="width:100%;margin-top:10px">Sign in</button>
    </form>
    <div id="evList" hidden></div>
    <button class="btn ghost sm" id="gateOut" hidden>Sign out</button>
  </div>
</div>

<div id="app" hidden>
  <div class="bar"><div class="in">
    <div class="row brand" style="gap:10px"><div class="logo">A</div><div><b id="evTitle">Grading</b><small id="evSub"></small></div></div>
    <div class="tabs" id="tabs">
      <button data-v="run">Run of day</button><button data-v="roll">Roll call</button><button data-v="score">Scoring</button>
      <button data-v="quiz">Theory test</button><button data-v="mc">MC</button><button data-v="results">Results</button>
    </div>
    <span class="grow"></span>
    <span id="sync" class="tiny"></span>
    <div class="clock" id="clock"></div>
  </div></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CFG = window.TOOLKIT_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { lock:(()=>{let q=Promise.resolve();return(n,t,f)=>{const r=q.then(f,f);q=r.catch(()=>{});return r;};})() } });
const HUB = { sb, url: CFG.SUPABASE_URL, key: CFG.SUPABASE_KEY, form: '#siForm' };
try { if (window.AmaIdle) AmaIdle.watch({ sb }); } catch (e) {}
function toast(m, ms = 2600) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
const S = { me: '', perms: [], ev: null, present: new Set(), marks: {}, outcomes: {}, view: 'run', sel: null, quiz: null, tv: false, lastSync: 0 };
const can = (...w) => S.perms.includes('admin') || w.some(x => S.perms.includes(x));
const C = () => S.ev.config, cands = () => C().candidates || [], cand = id => cands().find(c => c.id === id);
const syl = c => C().syllabi[c.syl], itemOf = code => { for (const k in C().syllabi) { const it = C().syllabi[k].items.find(i => i.code === code); if (it) return it; } return null; };
const mk = (cid, code) => S.marks[cid + '|' + code] || null;
const live = () => S.ev.live || {};
const sydNow = () => new Date();
const hhmm = t => { const [h, m] = String(t).split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };
const mmss = s => { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? '+' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const shortName = n => { const p = String(n).split(' '); return p[0] + (p.length > 1 ? ' ' + p[p.length - 1][0] : ''); };
const inGroups = gs => cands().filter(c => gs.includes(c.group));
const rollTaken = () => S.present.size > 0;
const isHere = id => !rollTaken() || S.present.has(id);

/* ---------- data ---------- */
async function loadEvent(id) {
  const { data, error } = await sb.from('ge_events').select('*').eq('event_id', id).maybeSingle();
  if (error || !data) { toast('Could not load the event.'); return false; }
  S.ev = data; return true;
}
async function loadLive() {
  if (!S.ev) return;
  const id = S.ev.event_id;
  const [ev, pr, mk2, oc] = await Promise.all([
    sb.from('ge_events').select('live, config, approved_at, approved_by, updated_at').eq('event_id', id).maybeSingle(),
    sb.from('ge_present').select('cand_id').eq('event_id', id),
    sb.from('ge_marks').select('cand_id, item_code, result, comment, scored_by, updated_at').eq('event_id', id),
    sb.from('ge_outcomes').select('cand_id, outcome, note, set_by').eq('event_id', id)]);
  if (ev.error) { $('#sync').textContent = 'Offline: retrying'; return; }
  Object.assign(S.ev, ev.data);
  S.present = new Set((pr.data || []).map(r => r.cand_id));
  S.marks = {}; (mk2.data || []).forEach(r => S.marks[r.cand_id + '|' + r.item_code] = r);
  S.outcomes = {}; (oc.data || []).forEach(r => S.outcomes[r.cand_id] = r);
  S.lastSync = Date.now(); $('#sync').textContent = '';
}
async function setLive(patch) {
  S.ev.live = { ...live(), ...patch }; render();
  const { error } = await sb.rpc('ge_live_set', { p_event: S.ev.event_id, p_patch: patch });
  if (error) toast('Could not save: ' + error.message, 4000);
}
async function fn(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/gevent', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + (session ? session.access_token : '') }, body: JSON.stringify({ event_id: S.ev.event_id, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || 'That didn’t work.');
  return j;
}

/* ---------- marks ---------- */
async function setMark(cid, code, result, comment) {
  if (S.ev.approved_at) return toast('Results are approved and locked.');
  if (!can('scoring', 'grading', 'results')) return toast('Your login can’t score.');
  const key = cid + '|' + code, cur = S.marks[key] || {};
  const row = { event_id: S.ev.event_id, cand_id: cid, item_code: code, result: result === undefined ? cur.result || null : result, comment: comment === undefined ? cur.comment || null : comment, scored_by: S.me, updated_at: new Date().toISOString() };
  if (!row.result && !row.comment) { delete S.marks[key]; render(); const { error } = await sb.from('ge_marks').delete().eq('event_id', row.event_id).eq('cand_id', cid).eq('item_code', code); if (error) toast('Not saved: ' + error.message, 4000); return; }
  S.marks[key] = row; render();
  const { error } = await sb.from('ge_marks').upsert(row, { onConflict: 'event_id,cand_id,item_code' });
  if (error) toast('Not saved: ' + error.message, 4000);
}
// The item codes a candidate is scored on in an assess step
const stepCodes = (st, c) => (st.items && st.items[c.syl]) || [];
const unscoredIn = (st) => { const out = []; for (const c of inGroups(st.groups)) { if (!isHere(c.id)) continue; for (const code of stepCodes(st, c)) if (!(mk(c.id, code) || {}).result) out.push({ c, code }); } return out; };
const blockUnscored = b => (b.assess || []).flatMap(unscoredIn);

/* ---------- views ---------- */
function render() {
  if (!S.ev) return;
  $$('#tabs [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  ({ run: vRun, roll: vRoll, score: vScore, quiz: vQuiz, mc: vMc, results: vResults })[S.view]();
}
function tickClock() {
  $('#clock').textContent = new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', timeZone: 'Australia/Sydney' });
  $$('[data-timer]').forEach(el => {
    const start = Date.parse(el.dataset.timer), mins = Number(el.dataset.mins || 0), up = el.dataset.up === '1';
    if (!start) { el.textContent = up ? '0:00' : mmss(mins * 60); return; }
    const gone = (Date.now() - start) / 1000;
    if (up) { el.textContent = mmss(gone); const g = Number(el.dataset.guide || 0); el.classList.toggle('soon', g && gone > g * .85 && gone <= g); el.classList.toggle('over', g && gone > g); return; }
    const left = mins * 60 - gone; el.textContent = mmss(left); el.classList.toggle('over', left < 0); el.classList.toggle('soon', left >= 0 && left < 60);
  });
}

// ----- Run of day -----
function stepsOf(b) { return [{ kind: 'seminar', time: b.time, mins: b.mins, label: b.rollcall ? 'Roll call' : b.public ? 'Public hour' : (b.assess && b.assess.length ? 'Seminar: everyone trains' : b.title) }, ...(b.assess || []).map((a, i) => ({ kind: 'assess', i, ...a, label: 'Assess ' + a.groups.join(' + ') }))]; }
function vRun() {
  const bs = C().blocks, L = live(), bi = Math.min(Math.max(0, L.block ?? 0), bs.length - 1), b = bs[bi], steps = stepsOf(b), si = Math.min(L.step ?? 0, steps.length - 1), st = steps[si];
  const started = L.block === bi && L.step === si ? L.started : null;
  const un = blockUnscored(b);
  $('#main').innerHTML = `<div class="run">
    <div class="blist">${bs.map((x, i) => { const u = blockUnscored(x).length, closed = L['closed_' + x.id];
      return `<button class="bitem ${i === bi ? 'now' : closed ? 'done' : ''}" data-b="${i}"><span class="t">${hhmm(x.time)}</span><span class="grow"><b>${esc(x.title)}</b>
      <span class="tiny">${(x.assess || []).length ? (x.assess || []).map(a => a.groups.join('+')).join(' · ') : 'Not assessed'}</span></span>

      ${b.rollcall ? `<div class="row" style="margin-top:14px"><span class="muted">${S.present.size} of ${cands().length} marked present</span><button class="btn" id="rRoll">Open roll call</button></div>` : ''}

}

}

// ----- Scoring -----
function allSteps() { const out = []; C().blocks.forEach((b, bi) => (b.assess || []).forEach((a, i) => out.push({ b: bi, s: i, block: b, st: a }))); return out; }
function vScore() {
  const list = allSteps(), L = live();
  if (!S.sel) { const cb = C().blocks[L.block ?? 0], cs = cb && stepsOf(cb)[L.step ?? 0]; S.sel = cs && cs.kind === 'assess' ? { b: L.block, s: cs.i } : { b: list[0].b, s: list[0].s }; }
  const cur = list.find(x => x.b === S.sel.b && x.s === S.sel.s) || list[0], st = cur.st;
  const rows = inGroups(st.groups).sort((a, b) => (isHere(b.id) - isHere(a.id)) || 0);
  const legend = Object.entries(st.items).map(([k, codes]) => `<div class="small"><b>${esc(C().syllabi[k].name)}</b>: ${codes.map(c => `<b>${c}</b> ${esc(itemOf(c).section)}`).join(' · ')}</div>`).join('');
  const un = unscoredIn(st).length;
  $('#main').innerHTML = `<div class="row" style="margin-bottom:10px"><h2 class="grow">Scoring</h2>
      <select id="stepSel">${list.map(x => `<option value="${x.b}:${x.s}" ${x === cur ? 'selected' : ''}>${hhmm(x.st.time)} · ${esc(x.block.title)} · ${esc(x.st.groups.join(' + '))}</option>`).join('')}</select></div>
    ${S.ev.approved_at ? '<div class="card" style="border-color:var(--ok);margin-bottom:10px">Results are approved and locked.</div>' : ''}
    ${st.quiz ? `<div class="card" style="margin-bottom:10px">The theory item is marked from the test. Open the <b>Theory test</b> tab and press <b>Record theory results</b> once it has finished, or mark someone by hand below.</div>` : ''}
    <div class="legend">${legend}</div>
    <div class="row small muted" style="margin-bottom:8px"><span class="grow">Tap an item: pass, then fail, then clear. Press <b>Note</b> to add a comment.</span><span class="${un ? '' : 'tag ok'}" style="${un ? 'color:var(--warn)' : ''}">${un ? un + ' to score' : 'All scored'}</span></div>
    <div style="display:flex;flex-direction:column;gap:6px">${rows.map(c => { const codes = stepCodes(st, c), here = isHere(c.id);
      return `<div class="srow ${here ? '' : 'absent'}"><div><b>${esc(c.name)}</b><div class="tiny">${esc(c.group)} · ${esc(c.to)}${c.dan_no ? ' · ' + c.dan_no : ''}${here ? '' : ' · not at roll call'}</div></div>
        <div class="chips">${codes.map(code => { const m = mk(c.id, code) || {}; return `<button class="chip ${m.result || ''}" data-m="${c.id}|${code}" title="${esc(itemOf(code).text)}">${code}<small>${m.result === 'pass' ? 'Pass' : m.result === 'fail' ? 'Fail' : esc(itemOf(code).section)}</small>${m.comment ? '<span class="c"></span>' : ''}</button>`; }).join('')}</div>
        <div class="row" style="gap:6px"><button class="btn sm" data-all="${c.id}">All pass</button><button class="btn sm ghost" data-note="${c.id}">Note</button></div></div>`; }).join('')}</div>`;
  $('#stepSel').onchange = e => { const [b, s] = e.target.value.split(':').map(Number); S.sel = { b, s }; render(); };
  $$('[data-m]').forEach(x => x.onclick = () => { const [cid, code] = x.dataset.m.split('|'), m = mk(cid, code) || {}; setMark(cid, code, m.result === 'pass' ? 'fail' : m.result === 'fail' ? null : 'pass'); });
  $$('[data-all]').forEach(x => x.onclick = () => { const c = cand(x.dataset.all); stepCodes(st, c).forEach(code => { if (!(mk(c.id, code) || {}).result) setMark(c.id, code, 'pass'); }); });
  $$('[data-note]').forEach(x => x.onclick = () => noteDlg(cand(x.dataset.note), stepCodes(st, cand(x.dataset.note))));
}
function noteDlg(c, codes) {
  openDlg(`<h3>${esc(c.name)}</h3><p class="tiny">Comments are for the panel and Mark. Nothing goes to families until results are approved.</p>
    ${codes.map(code => { const m = mk(c.id, code) || {}; return `<div class="field" style="margin:8px 0"><label>${code} · ${esc(itemOf(code).section)} ${m.result ? `<span class="tag ${m.result === 'pass' ? 'ok' : 'bad'}">${m.result}</span>` : ''}</label><textarea rows="2" data-n="${code}">${esc(m.comment || '')}</textarea></div>`; }).join('')}

  $('#nSave').onclick = () => { $$('#dlg [data-n]').forEach(t => { const code = t.dataset.n, v = t.value.trim() || null; if ((mk(c.id, code) || {}).comment !== v && !(v === null && !(mk(c.id, code) || {}).comment)) setMark(c.id, code, undefined, v); }); closeDlg(); };

// ----- Theory test (private, own pace on their phones) -----
async function pollQuiz() { try { S.quiz = await fn({ action: 'host_state' }); S.quiz.at = Date.now(); if (S.view === 'quiz' && !$('#dlg').open) vQuiz(); } catch (e) { $('#sync').textContent = e.message; } }
async function qCmd(cmd, extra = {}) { try { const r = await fn({ action: 'host', cmd, ...extra }); if (S.quiz) S.quiz.quiz = r.quiz; await pollQuiz(); } catch (e) { toast(e.message, 4000); } }
const testLeft = () => { const hs = S.quiz, z = hs && hs.quiz; if (!z || !z.q_ends_at) return 0; const skew = hs.server_now - hs.at; return Math.max(0, Math.ceil((Date.parse(z.q_ends_at) - (Date.now() + skew)) / 1000)); };
function vQuiz() {
  const Q = C().quiz, hs = S.quiz, z = hs && hs.quiz;
  let ph = z ? z.phase : 'closed'; if (ph === 'open' && testLeft() <= 0) ph = 'ended';
  const pl = Object.fromEntries(((hs && hs.players) || []).map(p => [p.cand_id, p]));
  const nIn = Object.keys(pl).length, nSub = Object.values(pl).filter(p => p.submitted_at).length, total = (hs && hs.total) || Q.questions.length;
  const url = location.origin + '/q/#' + S.ev.join_code;
  let body = '';

  else if (ph === 'closed') body = `<div class="card" style="max-width:680px"><h2>Theory test</h2><p class="muted">${total} questions. Each candidate signs in on their own phone, works through the test at their own pace for ${Q.minutes || 30} minutes, can change answers, then submits. Pass is all ${total} right: anyone with a wrong answer is told only which questions to redo (not the answers) and redoes just those. It's private: nobody sees scores except staff, here.</p><button class="btn primary" data-q="open">Open sign-in</button></div>`;
  else if (ph === 'lobby') {
    let qr = ''; try { const g = qrcode(0, 'M'); g.addData(url); g.make(); qr = g.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch (e) { qr = ''; }
    body = `<div class="lobby"><div class="qr">${qr}</div><div><div class="qtext">Theory test: scan to sign in</div><p style="font-size:clamp(18px,2vw,30px);margin:10px 0">or go to <b>${esc(location.host)}/q</b> and enter <b style="color:var(--accent);letter-spacing:.1em">${esc(S.ev.join_code)}</b></p>
      <p class="meta"><span>${nIn} of ${cands().length} signed in</span></p><div class="joined">${cands().map(c => `<span class="${pl[c.id] ? 'in' : ''}">${esc(shortName(c.name))}</span>`).join('')}</div></div></div>`;
  } else {
    const left = testLeft();
    const big = `<div style="text-align:center;margin-top:${S.tv ? '14vh' : '10px'}"><div class="meta" style="justify-content:center">${ph === 'ended' ? 'Test finished' : 'Theory test in progress'}</div>
      <div class="ring" id="tLeft" style="font-size:${S.tv ? 'clamp(80px,16vw,240px)' : '80px'};text-align:center">${ph === 'ended' ? '0:00' : mmss(left)}</div>
      <div class="qtext" style="font-size:clamp(22px,3vw,44px)">${nSub} of ${nIn} finished</div>${ph !== 'ended' && S.tv ? '<p class="muted" style="font-size:clamp(16px,1.8vw,26px)">Work at your own pace. If any answers are wrong when you submit, your phone shows which questions to redo.</p>' : ''}</div>`;
    const table = S.tv ? '' : `<div class="card" style="margin-top:16px;overflow:auto"><div class="row" style="margin-bottom:6px"><h3 class="grow">Candidates</h3><span class="tiny">Only staff see this</span></div><table><thead><tr><th>Candidate</th><th>Status</th><th>Answered</th><th>First try</th><th>Rounds</th>${ph === 'ended' ? '<th>Right now</th><th>Theory</th>' : ''}</tr></thead><tbody>
      ${cands().map(c => { const p = pl[c.id]; return `<tr><td>${esc(c.name)}<div class="tiny">${esc(c.group)}</div></td><td>${!p ? '<span class="tag">Not signed in</span>' : p.submitted_at ? '<span class="tag ok">All right</span>' : ph === 'ended' ? '<span class="tag warn">Time up</span>' : Array.isArray(p.redo) ? `<span class="tag warn">Redoing ${p.redo.length}</span>` : '<span class="tag now">Answering</span>'}${p && p.via === 'tablet' ? ' <span class="tiny">tablet</span>' : ''}</td>
        <td>${p ? p.answered + ' / ' + total : '—'}</td><td>${p && p.first_score != null ? p.first_score + ' / ' + total : '—'}</td><td>${p && p.rounds ? p.rounds : '—'}</td>${ph === 'ended' ? `<td><b>${p ? p.correct : '—'}</b>${p ? ' / ' + total : ''}</td><td>${p ? (p.correct >= Q.pass_mark ? '<span class="tag ok">Pass</span>' : '<span class="tag bad">Not passed</span>') : ''}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
    body = big + table;
  }
  const ctl = !hs ? '' : `<div class="ctl noprint">
    ${ph === 'lobby' ? `<button class="btn primary" data-q="start">Start the test (${Q.minutes || 30} min)</button>` : ''}

  const tb = $('#qTab'); if (tb) tb.onclick = () => {
    openDlg(`<h3>Use this tablet for a candidate</h3><p class="small muted">For someone without a phone. Pick who is sitting the test; it opens in a new tab on this device.</p>
      <select id="tbWho" style="width:100%">${cands().map(c => `<option value="${c.id}">${esc(c.name)}${pl[c.id] ? ' (already signed in)' : ''}</option>`).join('')}</select>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="tbGo">Open their test</button><button class="btn ghost" data-x>Cancel</button></div>`);

document.addEventListener('keydown', e => { if (S.view === 'quiz' && e.key === 'f' && !$('#dlg').open && !/input|textarea|select/i.test(e.target.tagName)) { const b = $('#qTv'); if (b) b.click(); } });

      ${slack == null ? '' : `<span class="small ${slack < 0 ? '' : 'muted'}" style="${slack < 0 ? 'color:var(--bad)' : ''}">${slack >= 0 ? slack + ' min spare before 4:00pm' : -slack + ' min over: tighten changeovers'}</span>`}</div>
      <h2 style="margin-top:10px">${esc(a.title)}</h2>${a.sub ? `<div class="sub">${esc(a.sub)}</div>` : ''}

        ${started ? '' : '<button class="btn primary" id="mStart">Start timer</button>'}
        <button class="btn" id="mBack">Back</button><button class="btn primary" id="mNext">Next act</button></div>
      ${codes.length && who.length ? `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px"><div class="tiny" style="margin-bottom:6px">Panel: quick score for this act</div>
        ${who.map(c => { const code = codes.find(x => x.split('-')[0] === c.syl); if (!code) return ''; const m = mk(c.id, code) || {};
          return `<div class="row" style="margin:4px 0"><span class="grow">${esc(c.name)} <span class="tiny">${code}</span></span><button class="btn sm ${m.result === 'pass' ? 'ok' : ''}" data-ms="${c.id}|${code}|pass">Pass</button><button class="btn sm ${m.result === 'fail' ? 'danger' : ''}" data-ms="${c.id}|${code}|fail">Fail</button><button class="btn sm ghost" data-mn="${c.id}|${code}">Note</button></div>`; }).join('')}</div>` : ''}
    </div>
    <div class="card"><div class="row" style="margin-bottom:8px"><h3 class="grow">Running order</h3>${can('grading') ? '<button class="btn sm" id="mEdit">Edit showcases</button>' : ''}</div>
      <div class="alist">${acts.map((x, i) => `<button class="aitem ${i === ai ? 'now' : i < ai ? 'done' : ''}" data-a="${i}"><span class="tiny" style="min-width:20px">${i + 1}</span><span class="grow"><b>${esc(x.kind === 'board' || x.kind === 'showcase' ? x.sub : x.title)}</b>${x.kind === 'showcase' && (x.who || []).length > 1 ? ' <span class="tag">shared</span>' : ''}<br><span class="tiny">${esc(x.kind === 'board' ? 'Board breaking' : x.kind === 'showcase' ? 'Showcase' : x.sub || '')}</span></span></button>`).join('')}</div></div></div>`;
  $$('[data-a]').forEach(x => x.onclick = () => setLive({ act: +x.dataset.a, act_started: null }));
  $('#mNext').onclick = () => setLive({ act: Math.min(acts.length - 1, ai + 1), act_started: ai + 1 < acts.length ? new Date().toISOString() : null });
  $('#mBack').onclick = () => setLive({ act: Math.max(0, ai - 1), act_started: null });
  const ms = $('#mStart'); if (ms) ms.onclick = () => setLive({ act: ai, act_started: new Date().toISOString() });
  $$('[data-ms]').forEach(x => x.onclick = () => { const [c, code, r] = x.dataset.ms.split('|'); setMark(c, code, (mk(c, code) || {}).result === r ? null : r); });
  $$('[data-mn]').forEach(x => x.onclick = () => { const [c, code] = x.dataset.mn.split('|'); noteDlg(cand(c), [code]); });
  const me = $('#mEdit'); if (me) me.onclick = editActs;
  tickClock();
}
function editActs() {
  let acts = JSON.parse(JSON.stringify(C().acts));
  const draw = () => {
    const sc = acts.map((a, i) => ({ a, i })).filter(x => x.a.kind === 'showcase');
    $('#dlg').innerHTML = `<h3>Showcase order</h3><p class="tiny">Move acts up or down, join an act with the next one for a shared showcase, or split a shared one. Guide time is 45 seconds per person.</p>
      <div style="max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0">${sc.map((x, k) => `<div class="row" style="background:var(--bg);border-radius:10px;padding:6px 8px;gap:6px"><span class="grow small"><b>${k + 1}.</b> ${x.a.who.map(id => esc((cand(id) || {}).name)).join(' + ')}</span>
        <button class="btn sm" data-up="${x.i}" ${k ? '' : 'disabled'}>Up</button><button class="btn sm" data-dn="${x.i}" ${k < sc.length - 1 ? '' : 'disabled'}>Down</button>
        ${k < sc.length - 1 ? `<button class="btn sm" data-join="${x.i}">Join next</button>` : ''}${x.a.who.length > 1 ? `<button class="btn sm" data-split="${x.i}">Split</button>` : ''}</div>`).join('')}</div>
      <div class="row"><button class="btn primary" id="eSave">Save</button><button class="btn ghost" data-x>Cancel</button></div>`;
    const idx = () => acts.map((a, i) => a.kind === 'showcase' ? i : -1).filter(i => i >= 0);
    const swap = (i, d) => { const ix = idx(), p = ix.indexOf(i), j = ix[p + d]; if (j == null) return; [acts[i], acts[j]] = [acts[j], acts[i]]; draw(); };
    $$('#dlg [data-up]').forEach(b => b.onclick = () => swap(+b.dataset.up, -1));
    $$('#dlg [data-dn]').forEach(b => b.onclick = () => swap(+b.dataset.dn, 1));
    $$('#dlg [data-join]').forEach(b => b.onclick = () => { const i = +b.dataset.join, ix = idx(), j = ix[ix.indexOf(i) + 1]; acts[i].who = [...acts[i].who, ...acts[j].who]; acts[i].sub = acts[i].who.map(id => (cand(id) || {}).name).join(' + '); acts.splice(j, 1); draw(); });
    $$('#dlg [data-split]').forEach(b => b.onclick = () => { const i = +b.dataset.split, a = acts[i]; const parts = a.who.map(id => ({ ...a, id: 'sc-' + id.slice(0, 8), who: [id], sub: (cand(id) || {}).name })); acts.splice(i, 1, ...parts); draw(); });
    $('#eSave').onclick = async () => { const { error } = await sb.rpc('ge_config_set', { p_event: S.ev.event_id, p_key: 'acts', p_value: acts }); if (error) return toast(error.message, 4000); S.ev.config.acts = acts; closeDlg(); render(); toast('Running order saved'); };
    $$('#dlg [data-x]').forEach(b => b.onclick = closeDlg);
  };
  $('#dlg').showModal(); draw();
}

// ----- Results -----
function candCodes(c) { return (syl(c).items || []).map(i => i.code); }
function summary(c) { const codes = candCodes(c), p = [], f = [], u = []; codes.forEach(code => { const r = (mk(c.id, code) || {}).result; (r === 'pass' ? p : r === 'fail' ? f : u).push(code); }); return { p, f, u, suggest: f.length ? 'review' : u.length ? 'incomplete' : 'pass' }; }
function vResults() {
  const appr = S.ev.approved_at, rows = cands().map(c => ({ c, s: summary(c), o: S.outcomes[c.id] }));
  const ready = rows.filter(r => r.o).length;
  $('#main').innerHTML = `<div class="row" style="margin-bottom:12px"><h2 class="grow">Results</h2><button class="btn sm noprint" id="rCsv">Download CSV</button><button class="btn sm noprint" onclick="print()">Print</button></div>
    <div class="card" style="margin-bottom:12px;${appr ? 'border-color:var(--ok)' : ''}">${appr ? `<b>Approved</b> by ${esc(S.ev.approved_by || '')} at ${new Date(appr).toLocaleString('en-AU', { timeZone: 'Australia/Sydney' })}. Marks and results are locked.${can('admin') ? ' <button class="btn sm ghost noprint" id="unAp">Unlock</button>' : ''}`
      : `<b>Held for Mark to approve.</b> Nothing goes to candidates or families until results are approved. ${ready} of ${rows.length} results set.${can('admin') ? ` <button class="btn sm primary noprint" id="ap" ${ready < rows.length ? 'title="Set every result first"' : ''}>Approve results</button>` : ''}`}</div>
    <div class="card" style="overflow:auto"><table><thead><tr><th>Candidate</th><th>Grading</th><th>Scored</th><th>Failed items</th><th>Suggested</th><th>Result</th></tr></thead><tbody>
    ${rows.map(({ c, s, o }) => `<tr><td><b>${esc(c.name)}</b><div class="tiny">${esc(c.group)}${c.dan_no ? ' · ' + c.dan_no : ''}${isHere(c.id) ? '' : ' · not at roll call'}</div></td><td class="small">${esc(c.to)}</td>
      <td class="small">${s.p.length} pass${s.f.length ? `, <span style="color:var(--bad)">${s.f.length} fail</span>` : ''}${s.u.length ? `, <span style="color:var(--warn)">${s.u.length} not scored</span>` : ''}</td>
      <td class="small">${s.f.map(code => { const m = mk(c.id, code) || {}; return `<div><b>${code}</b> ${esc(itemOf(code).section)}${m.comment ? ': <span class="muted">' + esc(m.comment) + '</span>' : ''}</div>`; }).join('') || '—'}</td>
      <td>${s.suggest === 'pass' ? '<span class="tag ok">Pass</span>' : s.suggest === 'review' ? '<span class="tag bad">Review</span>' : '<span class="tag warn">Not finished</span>'}</td>
      <td>${appr || !can('grading', 'results') ? (o ? `<span class="tag ${o.outcome === 'pass' ? 'ok' : 'bad'}">${esc(o.outcome)}</span>${o.note ? '<div class="tiny">' + esc(o.note) + '</div>' : ''}` : '—')
        : `<select data-o="${c.id}"><option value="">Set…</option>${['pass', 'retest', 'fail'].map(v => `<option value="${v}" ${o && o.outcome === v ? 'selected' : ''}>${v[0].toUpperCase() + v.slice(1)}</option>`).join('')}</select>`}</td></tr>`).join('')}
    </tbody></table></div>
    ${!appr && can('grading', 'results') ? '<div class="row noprint" style="margin-top:10px"><button class="btn sm" id="fillPass">Set Pass for everyone suggested Pass</button></div>' : ''}`;
  $$('[data-o]').forEach(s => s.onchange = async () => {
    const id = s.dataset.o, v = s.value;
    const r = v ? await sb.from('ge_outcomes').upsert({ event_id: S.ev.event_id, cand_id: id, outcome: v, set_by: S.me, set_at: new Date().toISOString() }) : await sb.from('ge_outcomes').delete().eq('event_id', S.ev.event_id).eq('cand_id', id);
    if (r.error) toast(r.error.message, 4000); await loadLive(); render();
  });
  const fp = $('#fillPass'); if (fp) fp.onclick = async () => { const rows2 = rows.filter(r => r.s.suggest === 'pass' && !r.o).map(r => ({ event_id: S.ev.event_id, cand_id: r.c.id, outcome: 'pass', set_by: S.me, set_at: new Date().toISOString() })); if (!rows2.length) return toast('Nobody new to set.'); const { error } = await sb.from('ge_outcomes').upsert(rows2); if (error) toast(error.message); await loadLive(); render(); };
  const ap = $('#ap'); if (ap) ap.onclick = async () => { if (ready < rows.length && !confirm(`${rows.length - ready} result(s) aren't set. Approve anyway?`)) return; const { error } = await sb.rpc('ge_approve', { p_event: S.ev.event_id, p_on: true }); if (error) return toast(error.message, 4000); await loadLive(); render(); toast('Results approved and locked'); };
  const ua = $('#unAp'); if (ua) ua.onclick = async () => { const { error } = await sb.rpc('ge_approve', { p_event: S.ev.event_id, p_on: false }); if (error) return toast(error.message, 4000); await loadLive(); render(); };
  $('#rCsv').onclick = () => {
    const allCodes = [...new Set(cands().flatMap(candCodes))];
    const lines = [['Name', 'Group', 'Dan no', 'Grading', ...allCodes, 'Result', 'Note'].join(',')].concat(rows.map(({ c, o }) => [c.name, c.group, c.dan_no || '', c.to, ...allCodes.map(code => (mk(c.id, code) || {}).result || ''), o ? o.outcome : '', o && o.note || ''].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = S.ev.slug + '-results.csv'; a.click();
  };
}

/* ---------- dialog ---------- */
function openDlg(html) { const d = $('#dlg'); d.innerHTML = html; $$('#dlg [data-x]').forEach(b => b.onclick = closeDlg); if (!d.open) d.showModal(); }
function closeDlg() { $('#dlg').close(); }

/* ---------- navigation + boot ---------- */
function show(v) { S.view = v; try { history.replaceState(null, '', '#' + v); } catch (e) {} if (v !== 'quiz' && S.tv) S.tv = false; render(); if (v === 'quiz') pollQuiz(); }
$$('#tabs [data-v]').forEach(b => b.onclick = () => show(b.dataset.v));
async function openEvent(id) {
  if (!(await loadEvent(id))) return;
  try { const u = new URL(location.href); u.searchParams.set('e', S.ev.slug); history.replaceState(null, '', u.pathname + u.search + location.hash); } catch (e) {}
  $('#gate').hidden = true; $('#app').hidden = false;
  $('#evTitle').textContent = S.ev.title; document.title = S.ev.title;
  $('#evSub').textContent = new Date(S.ev.config.date + 'T12:00:00Z').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) + ' · ' + (S.ev.config.venue || '');
  await loadLive();
  const h = (location.hash || '').slice(1); if (['run', 'roll', 'score', 'quiz', 'mc', 'results'].includes(h)) S.view = h;
  render(); if (S.view === 'quiz') pollQuiz();
  setInterval(async () => { if ($('#dlg').open && S.view !== 'quiz') return; await loadLive(); if (!$('#dlg').open && S.view !== 'quiz') render(); }, 3000);
  setInterval(() => { if (S.view === 'quiz' && !$('#dlg').open) pollQuiz(); }, 2000);
  setInterval(() => { tickClock(); quizTick(); }, 250);
}
async function boot() {
  if (window.AmaHub) { try { await AmaHub.recheck(HUB); } catch (e) {} }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#gateMsg').textContent = 'Sign in with your AMA hub mobile and PIN'; $('#siForm').hidden = false; try { if (window.AmaHub) AmaHub.mount(HUB); } catch (e) {} return; }
  S.me = (session.user.email || '').toLowerCase();
  const { data: perms } = await sb.rpc('app_my_perms', { p_app: 'bb' }); S.perms = perms || [];
  $('#gateOut').hidden = false;
  if (!S.perms.length) { $('#gateMsg').textContent = "Your login doesn't have Black Belt Gradings access yet."; return; }
  const { data: evs, error } = await sb.from('ge_events').select('event_id, slug, title, config->>date').order('starts_at', { ascending: false });
  if (error || !evs || !evs.length) { $('#gateMsg').textContent = 'No grading events set up yet.'; return; }
  const want = new URLSearchParams(location.search).get('e');
  const pick = evs.find(e => e.slug === want) || (evs.length === 1 ? evs[0] : null);
  if (pick) return openEvent(pick.event_id);
  $('#gateMsg').textContent = 'Choose the grading'; $('#evList').hidden = false;
  $('#evList').innerHTML = evs.map(e => `<button class="btn" style="width:100%;margin:4px 0" data-ev="${e.event_id}">${esc(e.title)} · ${esc(e.date)}</button>`).join('');
  $$('[data-ev]').forEach(b => b.onclick = () => openEvent(b.dataset.ev));
}
$('#siForm').addEventListener('submit', async e => {
  e.preventDefault(); const go = $('#siGo'); go.disabled = true; $('#siErr').hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#siEmail').value.trim(), password: $('#siPass').value });
  if (error) { $('#siErr').textContent = 'Email or password not right.'; $('#siErr').hidden = false; go.disabled = false; return; }
  $('#siForm').hidden = true; boot();
});
$('#gateOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
boot();
</script>
</body>
</html>
