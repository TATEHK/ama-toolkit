<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1713">
<base href="/grading/floor/">
<link rel="icon" href="../../icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="../../icons/ama-apple-touch.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../../config.js"></script>
<script src="../../hub-signin.js"></script>
<script src="../../idle-logout.js"></script>
<title>Grading Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{
  /* AMA house style: pine black, gold for the one thing to press, green for done (matches the hub + Coloured Belts) */
  --bg:#0f1713; --panel:#15201a; --raise:#1b2821; --ink:#edf2ee; --ink-2:#a3b5a9; --ink-3:#74897b;
  --line:#253629; --line-2:#31473a; --accent:#f5c518; --accent-ink:#14130a;
  --mat:#17241c; --mat-2:#132018; --mat-line:#2c4433; --spot:#1f2d24; --spot-line:#37503f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); --radius:16px;
  --danger:#ef8a73; --ok:#2f9e5b; --ok-text:#7fd6a2; --warn:#f0b45a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Arial,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:31}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:16px;flex:none}
.brand b{font-family:"Barlow Semi Condensed";font-weight:600;font-size:17px;line-height:1;display:block}
.brand small{color:var(--ink-3);font-size:12px;font-weight:500}
.bar-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pill.code{cursor:pointer;color:var(--ink-3)}
.pill.code b{font-family:"Barlow Semi Condensed",sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--accent)}
.roleseg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.roleseg button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px}
.roleseg button.on{background:var(--accent);color:var(--accent-ink)}
.roleseg button.supr{color:var(--ink)}
.roleseg button.supr.on{background:#15181d;color:#fff}
:root[data-theme="dark"] .roleseg button.supr.on,:root:not([data-theme="light"]) .roleseg button.supr.on{background:#eef1f5;color:#0e1116}
body[data-role="master"] #groups{display:none}
body[data-role="master"] .side{display:none}
body[data-role="master"] .main{grid-template-columns:1fr}
body[data-role="master"] .floor{min-height:60vh}
.superbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#15181d;color:#fff;border-radius:12px;padding:11px 13px;margin-bottom:6px}
.superbar .sb-l{font-family:"Barlow Semi Condensed";font-weight:600;font-size:13px;letter-spacing:.03em}
.superbar .sb-belt{font-size:12.5px;display:flex;align-items:center;gap:6px;color:#cbd2da}
.superbar select{background:#242c36;color:#fff;border:1px solid #3a4452;border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12.5px}
.superbar .sb-rdy{margin-left:auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700}
.supertools{margin-top:4px;border-top:1px solid var(--line);padding-top:14px}
.supertools .st-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:9px}
#resetGrading{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.currpanel{padding:2px 2px 12px;max-height:62vh;overflow:auto}
.cp-sec{margin-top:13px}
.cp-h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:5px}
.cp-it{font-size:12.5px;line-height:1.4;padding:4px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
@media (max-width:560px){.roleseg button{padding:6px 9px;font-size:11.5px}}
.roleseg{overflow-x:auto;scrollbar-width:none}.roleseg::-webkit-scrollbar{display:none}
.cone{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;color:#fff;font-size:11px;font-weight:800;margin-right:7px;vertical-align:middle}
/* MC checklist */
.cp-it.say{cursor:pointer;align-items:center;gap:9px}
.cp-it.say:hover{background:var(--line-2)}
.cp-it .sk{width:16px;height:16px;border-radius:5px;border:1.8px solid var(--line);flex:none;position:relative}
.cp-it.done .sk{background:var(--accent);border-color:var(--accent)}
.cp-it.done .sk::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cp-it.done span:last-child{color:var(--ink-3);text-decoration:line-through}
/* self check-in kiosk */
body[data-role="signin"] #app{display:none}
body[data-role="signin"]{overflow:hidden}
.kiosk{height:calc(100dvh - 62px);overflow:hidden}
.ki-wrap{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:22px max(16px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px))}
.ki-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex:none}
.ki-logo{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:22px;flex:none}
.ki-head h1{font-family:"Barlow Semi Condensed";font-size:26px;line-height:1}
.ki-head p{color:var(--ink-3);font-size:14px;margin-top:4px}
.ki-input{width:100%;font-size:22px;padding:17px 20px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font-family:inherit;font-weight:600}
.ki-input:focus{outline:0;border-color:var(--accent)}
.ki-input{flex:none}
.ki-results{margin-top:14px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;min-height:0}
.ki-res{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;text-align:left;width:100%}
.ki-res:hover{border-color:var(--accent)}
.ki-av{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:18px;color:#fff;flex:none}
.ki-rt{flex:1;min-width:0}.ki-rt b{font-size:18px;display:block}.ki-rt span{font-size:13px;color:var(--ink-3)}
.ki-go{font-weight:700;color:var(--accent);font-size:15px;white-space:nowrap}
.ki-hint,.ki-none{color:var(--ink-3);text-align:center;padding:28px 10px;font-size:15px}
.ki-wrap.done{justify-content:center;overflow-y:auto}
.ki-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:38px 26px;text-align:center;flex:none}
.ki-check{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 16px}.ki-check svg{width:34px;height:34px}
.ki-name{font-family:"Barlow Semi Condensed";font-size:28px;line-height:1.05}
.ki-msg{color:var(--ink-3);font-size:15px;margin-top:4px}
.ki-group{display:flex;align-items:center;gap:16px;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;margin:22px 0 12px}
.ki-cone{width:58px;height:58px;border-radius:14px;background:var(--bc);color:#fff;display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:30px;flex:none}
.ki-gi{text-align:left}.ki-gi b{font-family:"Barlow Semi Condensed";font-size:24px;display:block;line-height:1}.ki-gi span{font-size:14px;color:var(--ink-2)}
.ki-find{font-size:15px;color:var(--ink-2)}
.ki-next{margin-top:22px;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700}
.ki-input[readonly]{cursor:default}
.ki-kb{margin-top:14px;display:flex;flex-direction:column;gap:7px;flex:none}
.kb-row{display:flex;gap:6px;justify-content:center}
.kb-key{flex:1;min-width:0;max-width:58px;height:50px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font-size:18px;font-weight:700;font-family:inherit;touch-action:manipulation}
.kb-key:hover{border-color:var(--accent)}
.kb-key:active{background:var(--line-2);transform:scale(.96)}
.kb-wide{max-width:none;flex:1.4;font-size:16px}
.kb-space{flex:3.2;max-width:none;font-size:14px;color:var(--ink-3);font-weight:600;letter-spacing:.05em}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);display:grid;place-items:center}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.icon-btn svg{width:20px;height:20px}
/* group tabs */
.groups{display:flex;gap:10px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.gtab{flex:none;min-width:150px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 15px;transition:.14s;position:relative}
.gtab:hover{border-color:var(--ink-3)}
.gtab[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gtab .gname{font-family:"Barlow Semi Condensed";font-weight:600;font-size:16px}
.gtab .gmeta{font-size:12px;color:var(--ink-3);margin-top:3px;font-weight:500}
.gtab .gdots{display:flex;gap:3px;margin-top:9px}
.gtab .gdots i{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12)}
.gcount{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:var(--ink-2)}
.gtab.live{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.gtab.done{opacity:.55}
.gbadge{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.02em}
.gbadge.live{color:var(--accent)} .gbadge.done{color:var(--ink-3)}
.flctrl{margin-left:auto;display:flex;align-items:center;gap:10px}
.statustag{font-family:"Barlow Semi Condensed";font-weight:600;font-size:13px;letter-spacing:.03em}
.statustag.live{color:var(--accent)} .statustag.done{color:var(--ink-3)}
.sbtn{border:0;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;color:#fff}
.sbtn.start{background:var(--accent);color:var(--accent-ink)}
.sbtn.done{background:#15181d;color:#fff}
.sbtn.re{background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.alertbar{display:flex;align-items:center;gap:12px;margin:16px 20px 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--danger) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.alertbar .al-ic{width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.alertbar .al-tx{flex:1;min-width:0}
.alertbar .al-tx b{display:block;font-size:13.5px}
.alertbar .al-tx span{font-size:12px;color:var(--ink-2)}
.alertbar .al-add{border:0;background:var(--danger);color:#fff;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.alertbar .al-x{border:0;background:transparent;color:var(--ink-3);font-size:14px;padding:4px 6px}
.floor.live{box-shadow:inset 0 0 0 3px var(--accent)}
.floor.past{filter:grayscale(.4) opacity(.75)}
/* layout */
.main{display:grid;grid-template-columns:1fr 310px;gap:18px;padding:14px 0 40px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.floorwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.floorhead{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.floorhead h2{font-size:19px}
.floorhead .sub{color:var(--ink-3);font-size:13px;font-weight:500}
.dim{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.floor{position:relative;margin:20px;border-radius:12px;
  background:
    repeating-linear-gradient(0deg,transparent,transparent calc(16.666% - 1px),var(--mat-line) 16.666%),
    repeating-linear-gradient(90deg,transparent,transparent calc(16.666% - 1px),var(--mat-line) 16.666%),
    linear-gradient(135deg,var(--mat),var(--mat-2));
  border:3px solid var(--mat-line);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.floor .instr{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:"Barlow Semi Condensed";font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(0,0,0,.34);font-weight:600}
.spot{position:absolute;transform:translate(-50%,-50%);width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.spot:active{cursor:grabbing}
.spot .dot{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:15px;color:#fff;transition:transform .1s;
  background:radial-gradient(circle at 36% 30%,#ff6f5f,#d5322a 72%);box-shadow:0 3px 7px rgba(120,18,14,.45),inset 0 -3px 6px rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.55)}
.spot:not(.empty) .dot{background:var(--belt);color:var(--ink-on,#fff);box-shadow:0 3px 7px rgba(0,0,0,.28)}
.spot .dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3.5px solid var(--att,transparent)}
.spot.empty{cursor:default}
.spot.empty .dot{background:radial-gradient(circle at 36% 30%,#eb958c,#c9544c 72%);opacity:.45;color:transparent;box-shadow:0 2px 5px rgba(120,18,14,.3);border-color:rgba(255,255,255,.35)}
.spot:not(.empty):hover .dot{transform:translateY(-2px)}
.spot.sel .dot{outline:3px solid #15181d;outline-offset:3px}
.spot.drop .dot{outline:3px dashed #fff;outline-offset:3px;transform:scale(1.1)}
.spot .nm{font-size:11px;font-weight:600;color:#2a2111;background:rgba(255,255,255,.86);padding:2px 7px;border-radius:7px;max-width:82px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.ghost{position:fixed;transform:translate(-50%,-50%);z-index:70;pointer-events:none}
.ghost .dot{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:15px;color:#fff;background:radial-gradient(circle at 36% 30%,#ff6f5f,#d5322a 72%);box-shadow:0 10px 22px rgba(0,0,0,.4);border:2px solid #fff}
.floor.empty{min-height:200px;display:grid;place-items:center}
.floor.empty .instr{position:static;transform:none;color:rgba(0,0,0,.4)}
/* roster side */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:14px 16px 0}
.card .ch-sub{padding:2px 16px 0;font-size:12px;color:var(--ink-3)}
.roster{padding:10px 10px 12px;display:flex;flex-direction:column;gap:2px;max-height:430px;overflow:auto}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px}
.rrow:hover{background:var(--line-2)}
.rrow .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.14)}
.rrow .rn{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rn small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.rrow.absent .rn{color:var(--ink-3)}
.rrow.absent .rn b{text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);flex:none;display:grid;place-items:center;color:var(--ink-3)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:16px;height:16px}
.statline{display:flex;gap:0;border-top:1px solid var(--line-2)}
.statline div{flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--line-2)}
.statline div:last-child{border-right:0}
.statline b{font-family:"Barlow Semi Condensed";font-size:22px;display:block;line-height:1}
.statline span{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
/* profile drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,96vw);background:var(--panel);z-index:50;transform:translateX(100%);transition:transform .26s cubic-bezier(.22,.61,.36,1);box-shadow:-20px 0 50px rgba(0,0,0,.25);display:flex;flex-direction:column;
  padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.dh{padding:22px 22px 18px;border-bottom:1px solid var(--line);padding-top:max(22px,env(safe-area-inset-top,0px))}
.dh .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.closex{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);display:grid;place-items:center;flex:none}
.avatar{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-family:"Barlow Semi Condensed";font-weight:700;font-size:23px;color:#fff;flex:none}
.pname{font-family:"Barlow Semi Condensed";font-size:25px;line-height:1.05}
.pmeta{color:var(--ink-3);font-size:13px;font-weight:500;margin-top:3px}
.belttag{display:inline-flex;align-items:center;gap:7px;margin-top:11px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.belttag i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15)}
.dbody{padding:18px 22px 30px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.rtp{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600}
.rtp.no{background:var(--bg);color:var(--ink-3);border-color:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-family:"Barlow Semi Condensed";font-size:24px;margin-top:4px;line-height:1}
.stat .v small{font-family:Barlow;font-size:12px;color:var(--ink-3);font-weight:500}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const BELTS={ // name -> colour + rank
  'White':{c:'#c9ccd1',r:1},'Yellow':{c:'#f2c430',r:2},'Orange':{c:'#ef8a2b',r:3},
  'Green':{c:'#2f9e52',r:4},'Blue':{c:'#2f6fdb',r:5},'Purple':{c:'#7b4fc9',r:6},
  'Brown':{c:'#7a4a28',r:7},'Red':{c:'#d8362f',r:8},'Red Two':{c:'#b3281f',r:9},
  'Red Three':{c:'#8e1a16',r:10},'Cho Dan Bo':{c:'#2b2b2b',r:11}
};
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat'];
// ---- live data (loaded from cb_floor_load) ----
const shortB=b=>String(b||'').replace(/ Belt$/,'');
let DAYID=null, DAYINFO=null, CODE=null, id2entry={}, entry2id={};
const STUDENTS=[];           // the day's grading students
const absentIds=new Set();   // ids NOT yet checked in
function mapStudents(list){
  STUDENTS.length=0; absentIds.clear(); id2entry={}; entry2id={};
  for(const k in scores) delete scores[k]; for(const k in patt) delete patt[k]; for(const k in ticks) delete ticks[k];
  let i=0;
  for(const r of (list||[])){ const id=++i, belt=shortB(r.belt_from), belt_to=shortB(r.belt_to);
    id2entry[id]=r.entry_id; entry2id[r.entry_id]=id;
    const min=(CURR[belt]&&CURR[belt].min)||0, prog=min?Math.min(100,Math.round((r.classes||0)/min*100)):0;
    STUDENTS.push({ id, entry_id:r.entry_id, member_key:r.member_key, name:r.full_name||'—', belt, belt_to,
      weeks:r.weeks||0, classes:r.classes||0, lastGap:r.weeks||0, prog, ready:!!r.ready, bbc:!!r.bbc,
      sub:r.sub!==false, loc:r.loc||'', age:r.age||0, attend:r.attend||'green', fam:r.family||('f'+id),
      programs:(r.programs==null?null:r.programs), referrals:(r.referrals==null?null:r.referrals), days:[], pack:null, fee:null });
    if(r.score){ if(r.score.scores && Object.keys(r.score.scores).length) scores[id]={...r.score.scores};
      if(r.score.pattern) patt[id]=r.score.pattern; if(Array.isArray(r.score.ticks)&&r.score.ticks.length) ticks[id]=new Set(r.score.ticks); }
    if(!r.checked_in) absentIds.add(id);
  }
}
const siblingsOf=s=>STUDENTS.filter(x=>x.fam===s.fam && x.fam && x.id!==s.id);

const state={ fw:12, fh:10, spotsOut:13, autoBalance:true, groups:[], active:0, sel:null, alert:null, profTab:'ov', role:'admin' };
let dragging=false;

function roster(){ return STUDENTS.slice()

const spotsArr=n=>Array(Math.max(1,n)).fill(null);

function generateGroups(){ // one belt colour per group; split a belt into even groups only when it's over "spots out", youngest -> oldest
  const spots=Math.max(1,state.spotsOut), p=roster();          // every booked student, age-sorted — cones are set before anyone arrives
  const belts=[...new Set(p.map(s=>s.belt))].sort((a,b)=>beltR(a)-beltR(b));
  const groups=[];
  for(const belt of belts){
    const kids=p.filter(s=>s.belt===belt), G=Math.max(1,Math.ceil(kids.length/spots)), base=Math.floor(kids.length/G), extra=kids.length%G; let i=0;
    for(let gi=0;gi<G;gi++){ const cnt=base+(gi<extra?1:0), slots=spotsArr(spots);
      for(let k=0;k<cnt;k++) slots[k]=kids[i++].id;
      groups.push({name:`${belt} → ${nextOf(belt)}`+(G>1?` (${gi+1})`:''), belt, spots, rows:spots>8?2:1, status:'future', slots}); }
  }
  state.groups=groups.length?groups:[{name:'Group 1',belt:null,spots,rows:spots>8?2:1,status:'future',slots:spotsArr(spots)}];
  state.active=Math.min(state.active,state.groups.length-1); state.alert=null; recone();

  const s=byId(id);

}

  ids.slice(0,n).forEach((id,k)=>g.slots[k]=id); ids.slice(n).forEach(id=>{ if(!placeLate(id)) state.alert=byId(id); }); }

function positions(n,rows){
  if(n<=0) return [];
  if(rows===1 || n<=2) return Array.from({length:n},(_,i)=>({x:pad((i+.5)/n*100),y:50}));
  const nf=Math.ceil(n/2), nb=n-nf, y1=40, y2=66, pos=[];
  for(let c=0;c<nf;c++) pos.push({x:pad((c+.5)/nf*100),y:y1});       // front row
  for(let c=0;c<nb;c++) pos.push({x:pad((c+1)/nf*100),y:y2});        // back row, offset into the gaps
  return pos;
}

// drag a student from one red dot to another (works with touch + mouse); a short press with no move opens their profile
function wireFloor(gi,g){
  $$('#floor .spot').forEach(el=>{
    el.addEventListener('pointerdown',ev=>{
      if(ev.button&&ev.button!==0) return;
      const from=+el.dataset.i, startId=layoutFor(g)[from], sx=ev.clientX, sy=ev.clientY;
      let moved=false, ghost=null, tgt=null;
      const move=e=>{
        if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>8){ moved=true; dragging=true; if(startId!=null){ ghost=makeGhost(el); document.body.appendChild(ghost); el.style.opacity=.3; } }
        if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
          const t=spotUnder(e,el); if(t!==tgt){ if(tgt)tgt.classList.remove('drop'); tgt=t; if(t)t.classList.add('drop'); } }
      };
      const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); setTimeout(()=>dragging=false,50);
        if(ghost){ ghost.remove(); if(tgt){ tgt.classList.remove('drop'); dropMove(gi,g,from,+tgt.dataset.i); } else render(); }
        else if(!moved && startId!=null){ openProfile(startId); } };
      document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
    });
  });
}
function makeGhost(el){ const w=document.createElement('div'); w.className='ghost'; w.appendChild(el.querySelector('.dot').cloneNode(true)); return w; }
function spotUnder(e,self){ for(const n of document.elementsFromPoint(e.clientX,e.clientY)){ const sp=n.closest&&n.closest('.spot'); if(sp&&sp!==self&&sp.parentElement&&sp.parentElement.id==='floor') return sp; } return null; }

  $('#dayLabel').textContent = `${schoolOf(DAYINFO.location)} · ${fmtDay(DAYINFO.date)}`;
  loading = false;
  if (!(data.groups && data.groups.length)) persistGroups();
  $('#gate').hidden = true; render();
  if (pollT) clearInterval(pollT); pollT = setInterval(pollDay, 4000);
}
async function pollDay() {
  if (!DAYID || loading || state.sel || dragging || $('#modal').classList.contains('open')) return;   // don't clobber mid-action
  const { data } = await sb.rpc('cb_floor_load', { p_day: DAYID }); if (!data) return;
  loading = true; mapStudents(data.students); if (data.groups && data.groups.length) loadGroups(data.groups); loading = false; render();
}

// day picker + sign-in
async function showDays() {
  $('#siForm').hidden = true; $('#daypick').hidden = false; $('#gateMsg').textContent = 'Choose the grading day';
  const { data, error } = await sb.rpc('cb_floor_days');
  if (error) { $('#dayList').innerHTML = `<div class="dp-empty">No access yet — ask a Coloured Belts admin.</div>`; return; }
  const days = data || [];
  $('#dayList').innerHTML = days.length ? days.map(d => {
    const belts = (d.belts || []).map(shortB).sort((a,b)=>beltR(a)-beltR(b));
    const dots = belts.map(b=>`<span class="dp-bdot" style="background:${beltC(b)}" title="${b}"></span>`).join('');
    const names = belts.join(', ');
    return `<button class="dp-row" data-day="${d.day_id}"><div class="dp-main">
      <b>${schoolOf(d.location)}</b><span>${fmtDay(d.date)}</span>
      ${belts.length?`<div class="dp-belts"><span class="dp-dots">${dots}</span><span class="dp-bnames">${names}</span></div>`:''}
    </div><span class="dp-n" title="${d.entries} students">${d.entries}</span></button>`;
  }).join('') : `<div class="dp-empty">No upcoming grading days with students.</div>`;
  $$('#dayList .dp-row').forEach(b => b.onclick = () => loadDay(b.dataset.day));
}
async function boot() {
  if (window.AmaHub) { try { await AmaHub.recheck({ sb, url: CFG.SUPABASE_URL, key: CFG.SUPABASE_KEY }); } catch (e) {} }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#gate').hidden = false; $('#gateMsg').textContent = 'Sign in with your AMA hub mobile and PIN'; $('#siForm').hidden = false; $('#daypick').hidden = true; try { if (window.AmaHub) AmaHub.mount(HUB); } catch (e) {} return; }
  ME = (session.user.email || '').toLowerCase();
  const { data: perms } = await sb.rpc('app_my_perms', { p_app: 'cb' }); PERMS = perms || [];
  canSuper = (ME === SUPER_EMAIL);
  if (!canSuper) { const sx = $('#roleSeg [data-role="super"]'); if (sx) sx.remove(); if (state.role === 'super') state.role = 'admin'; }
  if (!PERMS.length) { $('#gate').hidden = false; $('#siForm').hidden = true; $('#daypick').hidden = false; $('#gateMsg').textContent = "You don't have Coloured Belts access yet."; $('#dayList').innerHTML = ''; return; }
  showDays();
}
$('#siForm').addEventListener('submit', async e => {
  e.preventDefault(); const go = $('#siGo'); go.disabled = true; go.textContent = 'Signing in…'; $('#siErr').hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#siEmail').value.trim(), password: $('#siPass').value });
  if (error) { $('#siErr').textContent = 'Email or password not right.'; $('#siErr').hidden = false; go.disabled = false; go.textContent = 'Sign in'; return; }
  boot();
});
function showCode() {
  const p = $('#codePill'); if (!CODE) { p.hidden = true; return; }
  $('#codeVal').textContent = CODE; p.hidden = false;
}
$('#codePill').onclick = () => {
  const url = location.origin + '/grading/check-in';
  toast(`Check-in code ${CODE} — open ${url} on each station and enter it`, 6000);
};
$('#gateOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
boot();
</script>
</body>
