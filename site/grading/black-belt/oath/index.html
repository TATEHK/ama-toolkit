<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Black Belt Oath · Australian Martial Arts Academy</title>
<link rel="icon" href="../../../icons/ama-id-cards.png">
<script src="../../../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root { --night:#0E0E0E; --gold:#FFD200; --paper:#FBFAF6; --ink:#1c1c1c; --muted:#6b675e; --line:#D9D4C7; --err:#B3261E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9E6DE; color: var(--ink); font-family: "Source Serif 4", Georgia, serif; -webkit-text-size-adjust: 100%; }
  header { background: var(--night); color: #fff; text-align: center; padding: 22px 20px 18px; }
  header img { width: 64px; height: auto; display: block; margin: 0 auto; }
  header .org { font-family: Oswald, "Arial Narrow", Arial, sans-serif; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; font-size: 14px; margin-top: 10px; }
  header .sub { font-family: Arial, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .3em; color: var(--gold); margin-top: 5px; text-transform: uppercase; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 14px 40px; }
  .sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 28px 24px 26px; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
  h1 { font-family: Oswald, "Arial Narrow", Arial, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; text-align: center; font-size: 30px; margin: 0 0 22px; }
  h1::after { content: ""; display: block; width: 48px; height: 3px; background: var(--gold); margin: 12px auto 0; }
  .iname { display: flex; align-items: baseline; gap: 10px; font-size: 19px; margin: 0 0 18px; }
  .iname span { flex: none; font-weight: 600; }
  .iname input { flex: 1; min-width: 0; font: inherit; font-size: 19px; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 4px 2px; border-radius: 0; color: var(--ink); }
  .iname input:focus { outline: none; border-bottom-color: #8a6d00; background: #fff8d6; }
  ol { margin: 0; padding-left: 1.4em; font-size: 17px; line-height: 1.6; }
  ol li { margin: 0 0 14px; padding-left: 4px; }
  .foot { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 26px; }
  .label { font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .pad { position: relative; height: 180px; border: 1.5px dashed #b9b2a2; border-radius: 6px; background: #fff; touch-action: none; }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .pad .hint { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; color: #b0a993; font-style: italic; pointer-events: none; font-size: 15px; }
  .pad .base { position: absolute; left: 18px; right: 18px; bottom: 28px; border-bottom: 1px solid #cfc9ba; pointer-events: none; }
  .pad.signed .hint { display: none; }
  .clear { font: 700 11px Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .date { font-size: 18px; border-bottom: 1.5px solid var(--ink); padding: 4px 2px; }
  .submit { margin-top: 26px; width: 100%; font: 700 16px Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); background: var(--night); border: 0; border-radius: 8px; padding: 16px; cursor: pointer; }
  .submit[disabled] { opacity: .55; cursor: default; }
  .msg { margin-top: 14px; font-family: Arial, sans-serif; font-size: 14px; color: var(--err); min-height: 1em; text-align: center; }
  .note { font-family: Arial, sans-serif; font-size: 13px; color: var(--muted); text-align: center; margin: 14px 4px 0; line-height: 1.5; }
  .state { text-align: center; font-family: Arial, sans-serif; padding: 40px 10px; color: var(--muted); }
  .done-banner { background: var(--night); color: #fff; border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; font-family: Arial, sans-serif; }
  .done-banner b { color: var(--gold); font-family: Oswald, Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; font-size: 18px; display: block; margin-bottom: 4px; }
  .sig-img { display: block; max-width: 100%; height: 120px; object-fit: contain; object-position: left center; border-bottom: 1.5px solid var(--ink); }
  .filled { border-bottom: 1.5px solid var(--ink); padding: 4px 2px; flex: 1; }
  .intro { text-align: center; margin: 6px 0 18px; font-family: Arial, sans-serif; }
  .intro h2 { font-family: Oswald, "Arial Narrow", Arial, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: .01em; margin: 0 0 6px; }
  .intro p { margin: 0 auto; max-width: 30em; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .intro a { display: inline-block; margin-top: 14px; color: var(--gold); background: var(--night); text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 8px; }
  .acc { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
  .acc details + details { border-top: 1px solid var(--line); }
  .acc summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px 20px; font-family: Arial, sans-serif; font-weight: 700; font-size: 15px; color: var(--ink); }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary::after { content: ""; margin-left: auto; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s ease-out; }
  .acc details[open] summary::after { transform: rotate(-135deg); }
  .acc .body { padding: 0 20px 18px; font-size: 16px; line-height: 1.6; }
  .acc .body p { margin: 0 0 12px; }
  .acc .body ol { font-size: 16px; line-height: 1.6; margin-bottom: 6px; }
  .acc .body ol li { margin-bottom: 8px; }
  .acc .body .gm { font-style: italic; margin-top: 16px; }
  @media (min-width: 560px) { .foot { grid-template-columns: 1.7fr 1fr; align-items: end; } .sheet { padding: 36px 40px 32px; } }
  @media print { body { background: #fff; } main { padding: 0; } .sheet { border: 0; } .done-banner, .note { display: none; } }
</style>
</head>
<body>
<header>
  <img src="https://www.australianmartialarts.com.au/wp-content/uploads/2019/12/logo1.png" alt="AMA">
  <div class="org">Australian Martial Arts Academy</div>
  <div class="sub">Sydney · Since 1982</div>
</header>
<main id="app"><div class="state">Loading your oath…</div></main>

<script>
(function () {
  var CFG = window.TOOLKIT_CONFIG || {};
  var FN = (CFG.SUPABASE_URL || 'https://ptdrcxngaptcgswfbjhg.supabase.co') + '/functions/v1/bboath';
  var OATH = [
    'Accept with honour and privilege my black belt in martial arts and hereby promise to uphold standards of honesty, integrity, courtesy, high moral code and indomitable spirit.',
    'I sincerely pledge to honour my instructors and school with loyalty, to value and carry on what I have learnt with respect and dignity.',
    'My art has thousands of years of history; I further pledge to continue the tradition with humility and gratitude by continuing my physical and spiritual growth to the highest possible level, to lead by example and to share what I have learnt with others.'
  ];
  var app = document.getElementById('app');
  var token = (location.hash || '').replace(/^#/, '').trim() || new URLSearchParams(location.search).get('t') || '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function longDate(ymd) {
    if (!ymd) return '';
    var p = String(ymd).slice(0, 10).split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  }
  function call(body) {
    return fetch(FN, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, CFG.SUPABASE_KEY ? { apikey: CFG.SUPABASE_KEY } : {}), body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Something went wrong. Please try again.' }; }); });
  }
  function oathList() { return '<ol>' + OATH.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>'; }
  // The paper oath pack, pages 2 and 3 (same words), folded into sections: read before signing, kept after
  var WELCOME =
    '<div class="acc">' +
    '<details open><summary>What is a black belt?</summary><div class="body">' +
    '<p>A black belt is someone who:</p><ol>' +
    '<li>Displays humility, accepts that they are always learning and challenges themself to always improve.</li>' +
    '<li>Is loyal and honours their martial arts school, instructors, family and all who have supported their black belt journey. Pledges to continue what they have learnt with dignity and respect.</li>' +
    '<li>Has a high-level skill which is maintained to defend themself, keep their body healthy and their mind sharp.</li>' +
    '<li>Shows respect for self, maintains a disciplined lifestyle, takes care of their appearance, and keeps their body in its best shape.</li></ol>' +
    '</div></details>' +
    '<details><summary>When do I get my first dan black belt and my name on my belt?</summary><div class="body">' +
    '' +
    '<p>You have just received a provisional black belt, this means that you have the skills and ability to be a black belt. Your training over the next 6 months will determine whether you have the attitude, commitment to a black belt way of life and improvement to full black belt standard. Once completing your 6 months of full training and club requirements you will be tested at the next grading to confirm that you are eligible to receive a full status first degree black belt (in which your name will be placed on your belt and you will receive a first degree black belt).</p>' +
    '<p>At AMA every student is important to us but you are now one of our most important students. We are always here to support your goals, help you set new ones, improve motivation and challenge you to do better, let us know if we can help you along your journey.</p>' +
    '</div></details>' +
    '<details><summary>What is Masters Club?</summary><div class="body">' +
    '' +
    '<p>You are now invited to (and it is highly recommended that you) join Masters Club, an exclusive club open only to those holding a black belt. This club will help you to learn: skills that require the mastery of a black belt, subsequent black belt curriculums and challenge even the best of us! Masters Club students are seen in the red and black Masters Club uniforms. You may take this up as another class or swap your membership from black belt club to masters club.</p>' +
    '</div></details>' +
    '<details><summary>What are black belts expected to do during their full training?</summary><div class="body">' +
    '<ol>' +
    '<li><b>Train</b> at least 3 sessions per week including one masters or black belt club.</li>' +
    '<li><b>Attend</b> as many gradings and events as possible to assist with pad holding and grading duties. Notice for non-attendance should be given.</li>' +
    '<li><b>Always</b> set a good example for other students.</li>' +
    '<li><b>Support</b> instructors and other students.</li>' +
    '<li><b>Continue</b> to look after their body, mind &amp; train hard to always exemplify what it means to be a black belt.</li>' +
    '<li><b>Learn</b> the 1st Dan Black Belt Curriculum.</li></ol>' +
    '</div></details>' +
    '<details><summary>A letter from Grand Master Manav</summary><div class="body">' +
    '<p>Dear Black Belt,</p><p>Congratulations!</p>' +
    '<p>I want to let you know how proud the Instructors, Head Instructors, and I are of you for achieving your new black belt rank. I do not doubt that you will carry on the tradition of excellence that our schools’ seniors have established.</p>' +
    '<p>Our black belt students are well known worldwide for their physical abilities, loyalty to their martial arts academy, and their outstanding work ethics. I think, however, they are especially known for having outstanding martial arts attitudes. I am very happy to see that you possess all of these very same qualities to a high degree.</p>' +
    '<p>Before you celebrate, I would like you to think of three things:</p>' +
    '<p>Firstly, think about your parents and spouses and how their sacrifice has really made this day possible. Think of all the time they dedicated to you so that you could achieve your black belt. Think of all their hours of waiting. Think of their commitment to your success in life. Remember as you go through life, no one loves you more and no one wishes you greater success than your parents and spouses.</p>' +
    '<p>Secondly, think about your teachers. Think about how they worked so personally and tirelessly with you to accomplish this goal. Your teachers teach, exert and model proper behaviour. They want you to continue your study. They want you to continue to grow, and like the black belts that have graduated before you, they want you to be a positive, contributing and respected member of society.</p>' +
    '<p>Lastly, think about yourself for a moment and what you have done today and what you have done to achieve your black belt. You should be very proud of yourself. Continue to study the virtues of a black belt. Practicing these principles will help ensure success in school, work and life. We have a saying “those who dare to teach or lead, must never cease to learn”. Well, now you are the leaders and you set the example for those who follow. Be loyal to your school. Think about how you can uphold the tradition of the black belt, always displaying black belt maturity and dignity in all your endeavours.</p>' +
    '<p>The literal meaning of “Dan” is “to carve steps up the cliff”. You have come a long way in your training and have overcome many obstacles, both physical and mental. You are a serious student! I’m sure you will discover by continued practice that what you thought was a perfection of a technique was merely an introduction to it. A tremendous journey of self-discovery awaits you. Again, congratulations on your accomplishment and welcome to a higher level of study.</p>' +
    '<p>Kind regards,</p><p class="gm">Grand Master Ridvan Manav</p>' +
    '</div></details>' +
    '</div>';
  function showState(text) { app.innerHTML = '<div class="state">' + esc(text) + '</div>'; }

  function showSigned(d, fresh) {
    app.innerHTML =
      '<div class="done-banner"><b>' + (fresh ? 'Signed. Thank you, ' + esc(d.first) + '.' : 'Already signed') + '</b>' +
      (fresh ? 'Your Black Belt Oath has been saved with AMA. You can close this page.' : 'This oath was signed on ' + esc(longDate(d.signed_date)) + '.') + '</div>' +
      '<div class="sheet"><h1>Black Belt Oath</h1>' +
      '<div class="iname"><span>I,</span><div class="filled">' + esc(d.name) + '</div></div>' + oathList() +
      '<div class="foot"><div><div class="label">Student signature</div>' + (d.signature ? '<img class="sig-img" alt="Signature" src="' + esc(d.signature) + '">' : '') + '</div>' +
      '<div><div class="label">Date</div><div class="date">' + esc(longDate(d.signed_date)) + '</div></div></div></div>' +
      '<div style="height:14px"></div>' + WELCOME;
  }

  function showForm(d) {
    app.innerHTML =
      '<div class="intro"><h2>Congratulations, ' + esc(d.first || 'black belt') + '</h2><p>Read about your new black belt below, then sign the Black Belt Oath.</p><a href="#oath" id="jump">Go to the oath</a></div>' +
      WELCOME +
      '<div class="sheet" id="oath"><h1>Black Belt Oath</h1>' +
      '<label class="iname"><span>I,</span><input id="nm" type="text" autocomplete="name" autocapitalize="words" maxlength="80" placeholder="your full name" value="' + esc(d.full_name || '') + '"></label>' +
      oathList() +
      '<div class="foot"><div><div class="label"><span>Student signature</span><button type="button" class="clear" id="clr">Clear</button></div>' +
      '<div class="pad" id="pad"><canvas id="cv" aria-label="Signature pad. Sign with your finger."></canvas><div class="base"></div><div class="hint">Sign here with your finger</div></div></div>' +
      '<div><div class="label">Date</div><div class="date">' + esc(longDate(d.today)) + '</div></div></div>' +
      '<button class="submit" id="go" type="button">Sign the oath</button><div class="msg" id="msg" role="alert"></div></div>' +
      '<p class="note">This page is private to ' + esc(d.first || 'you') + '. Once signed, the oath is saved to your AMA record.</p>';

    document.getElementById('jump').onclick = function (e) { e.preventDefault(); document.getElementById('oath').scrollIntoView({ behavior: 'smooth', block: 'start' }); };   // keeps the token in the address
    var pad = document.getElementById('pad'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    var strokes = [], cur = null, drawing = false;
    function size() {
      var r = cv.getBoundingClientRect(), dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redraw();
    }
    function line(s) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      if (s.length === 1) { ctx.arc(s[0][0], s[0][1], 1.3, 0, Math.PI * 2); ctx.fillStyle = '#111'; ctx.fill(); return; }
      ctx.moveTo(s[0][0], s[0][1]);
      for (var i = 1; i < s.length - 1; i++) { var mx = (s[i][0] + s[i + 1][0]) / 2, my = (s[i][1] + s[i + 1][1]) / 2; ctx.quadraticCurveTo(s[i][0], s[i][1], mx, my); }
      ctx.lineTo(s[s.length - 1][0], s[s.length - 1][1]); ctx.stroke();
    }
    function redraw() { var r = cv.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height); strokes.forEach(line); }
    function pt(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} drawing = true; cur = [pt(e)]; strokes.push(cur); pad.classList.add('signed'); redraw(); });
    cv.addEventListener('pointermove', function (e) { if (!drawing) return; e.preventDefault(); var ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; (ev.length ? ev : [e]).forEach(function (x) { cur.push(pt(x)); }); redraw(); });
    function end() { drawing = false; cur = null; }
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', function () { if (drawing) end(); });
    document.getElementById('clr').onclick = function () { strokes = []; pad.classList.remove('signed'); redraw(); };
    window.addEventListener('resize', function () { var r = cv.getBoundingClientRect(); if (Math.round(r.width) !== Math.round(cv.width / (window.devicePixelRatio || 1))) size(); });
    size();

    function inkLength() { var n = 0; strokes.forEach(function (s) { for (var i = 1; i < s.length; i++) n += Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]); }); return n; }
    // Export a trimmed PNG of just the signature, at 2x, max 1200px wide
    function exportPng() {
      var xs = [], ys = [];
      strokes.forEach(function (s) { s.forEach(function (p) { xs.push(p[0]); ys.push(p[1]); }); });
      var pad0 = 8, minX = Math.min.apply(null, xs) - pad0, minY = Math.min.apply(null, ys) - pad0, w = Math.max.apply(null, xs) - minX + pad0, h = Math.max.apply(null, ys) - minY + pad0;
      var scale = Math.min(2, 1200 / w), out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(w * scale)); out.height = Math.max(1, Math.round(h * scale));
      var o = out.getContext('2d'); o.setTransform(scale, 0, 0, scale, -minX * scale, -minY * scale);
      var keep = ctx; ctx = o; strokes.forEach(line); ctx = keep;
      return out.toDataURL('image/png');
    }

    var go = document.getElementById('go'), msg = document.getElementById('msg'), nm = document.getElementById('nm');
    go.onclick = function () {
      msg.textContent = '';
      var name = nm.value.replace(/\s+/g, ' ').trim();
      if (name.length < 2) { msg.textContent = 'Please write your full name after "I,".'; nm.focus(); return; }
      if (inkLength() < 40) { msg.textContent = 'Please sign in the box with your finger.'; return; }
      go.disabled = true; go.textContent = 'Saving…';
      call({ action: 'sign', token: token, name: name, signature: exportPng() }).then(function (r) {
        if (r && r.ok) { window.scrollTo(0, 0); showSigned(r, true); return; }
        if (r && r.signed) { showSigned(r, false); return; }
        msg.textContent = (r && r.error) || 'That didn’t save. Please try again.';
        go.disabled = false; go.textContent = 'Sign the oath';
      }).catch(function () { msg.textContent = 'No connection. Please check your internet and try again.'; go.disabled = false; go.textContent = 'Sign the oath'; });
    };
  }

  if (!/^[A-Za-z0-9_-]{16,64}$/.test(token)) { showState('This link isn’t valid. Please use the link from your email, or ask the front desk for a new one.'); return; }
  call({ action: 'info', token: token }).then(function (d) {
    if (!d || !d.ok) { showState((d && d.error) || 'This link isn’t valid.'); return; }
    if (d.signed) showSigned(d, false); else showForm(d);
  }).catch(function () { showState('No connection. Please check your internet and reload.'); });
})();
</script>
</body>
</html>
