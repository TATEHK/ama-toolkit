<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1713">
<title>AMA Operations</title>
<link rel="icon" href="../icons/ama-id-cards.png">
<link rel="apple-touch-icon" href="../icons/ama-apple-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../hub-signin.js"></script>
<script src="../idle-logout.js"></script>
<style>
  :root{
    --bg:#0f1713; --panel:#15201a; --raise:#1b2821; --line:#253629; --line2:#31473a; --ink:#edf2ee; --ink-2:#a3b5a9; --ink-3:#74897b;
    --accent:#f5c518; --accent-ink:#14130a; --ok:#7fd6a2; --gold:#f5c518; --warn:#f0b45a; --danger:#ef8a73; --danger-bg:#2a1816;
    --r:14px; --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
    --font-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --font-body:Barlow,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
    padding:0 max(14px,env(safe-area-inset-right)) 48px max(14px,env(safe-area-inset-left))}
  h1{font-family:var(--font-display);font-size:22px;margin:0;font-weight:700;letter-spacing:0}
  .appbar{margin:0 calc(-1 * max(14px,env(safe-area-inset-right))) 16px calc(-1 * max(14px,env(safe-area-inset-left)));background:var(--panel);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
  .appbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .home-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
  .home-btn svg{width:20px;height:20px}
  h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:26px 0 10px}
  a{color:var(--accent)}
  .wrap{max-width:1040px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 6px}
  .top .sp{flex:1}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border:0}
  .muted{color:var(--ink-3);font-size:13px}
  /* auth */
  .auth{max-width:380px;margin:12vh auto 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12px;font-weight:700;color:var(--ink-3)}
  .field input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit}
  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:3px}
  .tile:hover{border-color:var(--ink-3)}
  .tile[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .tile .n{font-family:"Barlow Semi Condensed",sans-serif;font-weight:800;font-size:34px;line-height:1}
  .tile .l{font-size:13px;font-weight:700;color:var(--ink-2)}
  .tile .s{font-size:12px;color:var(--ink-3)}
  .tile.warn .n{color:var(--warn)} .tile.bad .n{color:var(--danger)} .tile.ok .n{color:var(--ok)}
  .tile.zero{opacity:.62} .tile.zero .n{color:var(--ink-3)}
  /* detail panel */
  .detail{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:4px 14px;margin:10px 0 0}
  .detail h3{font-size:14px;margin:12px 2px 4px}
  .rowi{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .rowi:last-child{border-bottom:0}
  .rowi .nm{font-weight:700;min-width:0}
  .rowi .meta{color:var(--ink-3);font-size:12.5px;margin-left:auto;text-align:right;white-space:nowrap}
  .rowi .tag{font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
  .rowi .err{color:var(--danger);font-size:12.5px}
  .more{padding:9px 2px;color:var(--ink-3);font-size:12.5px}
  /* gradings */
  .grds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .grd{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
  .grd .gh{display:flex;align-items:baseline;gap:8px}
  .grd .gd{font-weight:800;font-size:15px}
  .grd .gt{color:var(--accent);font-weight:700;font-size:13px}
  .grd .gl{color:var(--ink-2);font-size:13px}
  .grd .gu{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:700}
  .badge{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--ink-3)}
  .badge.bb{color:var(--gold);border-color:var(--gold)}
  .badge.mk{color:var(--accent);border-color:var(--accent)}
  .lfilter{display:flex;flex-wrap:nowrap;gap:8px;margin:4px 0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .lfilter::-webkit-scrollbar{display:none}
  .lfilter + .lfilter{margin-top:0}
  .lchip{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
  .lchip:hover{border-color:var(--ink-3)}
  .lchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .today{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 6px}
  .today.live{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .today .th{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:0 0 10px}
  .today .trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .reqs{margin:22px 0 6px}
  .reqhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
  .reqhead h2{margin:0}
  .reqbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .reqlist{display:flex;flex-direction:column;gap:10px}
  .reqc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
  .reqc.open{border-left:3px solid var(--accent)}
  .reqc.resolved{opacity:.72}
  .rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rtop b{font-size:15px}
  .rb{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid}
  .rb.roster{color:var(--accent);border-color:var(--accent);background:rgba(245,197,24,.1)}
  .rb.problem{color:var(--danger);border-color:var(--danger);background:rgba(239,138,115,.1)}
  .rst{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px}
  .rst.approved,.rst.done{color:var(--ok);background:rgba(127,214,162,.12)}
  .rst.declined{color:var(--ink-3);background:rgba(255,255,255,.05)}
  .rctx{color:var(--ink-2);font-weight:600;font-size:13px;margin-top:4px}
  .rdet{color:var(--ink-2);font-size:14px;margin-top:6px;white-space:pre-wrap}
  .rmeta{color:var(--ink-3);font-size:12px;margin-top:7px}
  .racts{display:flex;gap:8px;margin-top:11px}
  .rwait{color:var(--ink-3);font-size:12.5px;font-style:italic;margin-top:9px}
  .reqrecent{margin-top:10px}
  .reqrecent summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600;padding:4px 0}
  .reqrecent .reqlist{margin-top:8px}
  .reqmodal{position:fixed;inset:0;z-index:9000;background:rgba(6,10,8,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media (max-width:560px){
    body{padding-bottom:40px}
    h1{font-size:19px}
    .appbar-inner{flex-wrap:nowrap;gap:7px}
    .appbar .btn{padding:7px 10px;font-size:13px}
    #updated{display:none}
    h2{margin:18px 0 8px}
    .otabs{gap:3px;padding:3px}
    .otab{padding:8px 11px;font-size:13px}
    .cal{gap:3px}
    .cal .cell{min-height:38px;padding:2px 3px}
    .cal .ev{font-size:9px;padding:1px 3px}
    .beltgrid{grid-template-columns:1fr 1fr}
    .cdgrid,.bbgrid{grid-template-columns:1fr}
    .live-stats .ls b{font-size:17px}
    .grd,.cdcard,.live-grd{padding:11px}
  }
  @media (min-width:560px){.reqmodal{align-items:center;padding:20px}}
  .reqbox{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:460px;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  @media (min-width:560px){.reqbox{border-radius:16px}}
  .reqbox h3{margin:0 0 14px;font-family:var(--font-display);font-weight:700}
  .reqbox label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 12px}
  .reqbox input,.reqbox select,.reqbox textarea{display:block;width:100%;margin-top:5px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
  .reqbox textarea{resize:vertical}
  .rbox{max-width:640px;max-height:92vh;overflow:auto}
  .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.rhead h3{margin:0 0 2px}
  .roh{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 6px}
  .slot{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .slot input{margin:0!important;padding:8px 10px!important}
  .slot .tm{display:flex;gap:4px;align-items:center;grid-column:1/3}.slot .tm input{width:auto;flex:1}.slot .tm span{color:var(--ink-3);font-size:12px}
  .slot .rm{grid-row:1/3;grid-column:3;background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:8px;width:34px;height:34px;cursor:pointer}
  .roadd{display:flex;gap:8px;margin:12px 0 14px}.roadd .btn:disabled{opacity:.4}
  .roh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .roh .lim{display:flex;align-items:center;gap:4px;font-weight:600}.roh .lim input{width:52px!important;display:inline-block!important;margin:0!important;padding:4px 6px!important}
  .rsgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.rsgrid label{margin:0!important}
  .rodec{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
  .rtag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
  .rtag.submitted{color:var(--accent);border-color:var(--accent)}.rtag.approved{color:var(--ok);border-color:var(--ok)}.rtag.declined{color:var(--danger);border-color:var(--danger)}
  .roswait{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .reqerr{color:var(--danger);font-size:13px;margin:0 0 10px}
  .reqact{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
  .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 7px}
  .bar i{display:block;height:100%;background:var(--ok)}
  .bar.low i{background:var(--warn)} .bar.vlow i{background:var(--danger)}
  .grd .st{display:flex;gap:12px;font-size:12.5px;flex-wrap:wrap}
  .grd .st b{color:var(--ink)} .grd .st span{color:var(--ink-3)}
  .grd .hp{margin-top:8px;font-size:12px;font-weight:700}
  .grd .hp.need{color:var(--warn)} .grd .hp.ok2{color:var(--ink-3)}
  /* live grading-day board */
  .live-grd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:8px 0 0}
  .live-grd.running{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .live-grd .lgh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 9px}
  .live-grd .lgh .gd{font-family:var(--font-display);font-weight:700}
  .live-grd .lgh .gl{color:var(--ink-2)}
  .live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .live-stats .ls{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
  .live-stats .ls b{display:block;font-size:19px;font-family:var(--font-display);line-height:1.1}
  .live-stats .ls span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
  .live-stats .ls.warn b{color:var(--warn)} .live-stats .ls.ok b{color:var(--ok)}
  /* calendar */
  .calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:nowrap}
  .calbar h2{margin:0}
  .caltitle{display:flex;align-items:baseline;gap:8px;min-width:0}
  .calmon{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .calnav{display:flex;gap:6px;flex:none}
  .calnav .btn{padding:7px 11px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .dow{font-size:10px;color:var(--ink-3);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding:2px 0}
  .cal .cell{min-height:46px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;background:var(--panel);overflow:hidden}
  .cal .cell.out{opacity:.4}
  .cal .cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .cal .cell .dn{color:var(--ink-3);font-size:10px}
  .cal .ev{display:block;border-radius:5px;padding:1px 4px;margin:2px 0 0;font-size:10px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal .ev.scheduled{background:rgba(245,197,24,.16);color:var(--accent)}
  .cal .ev.running{background:rgba(127,214,162,.2);color:var(--ok)}
  .cal .ev.done{background:rgba(163,181,169,.16);color:var(--ink-2)}
  .cal .ev.past{background:rgba(239,138,115,.14);color:var(--danger)}
  .callegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin:8px 0 0}
  .callegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
  /* helper load + recent results rows */
  .hlr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 6px}
  .hlr .hn{font-weight:700}
  .hlr .hc{color:var(--ink-3);font-size:12px;margin-top:1px}
  .hlr .ht{font-family:var(--font-display);font-weight:700;font-size:17px;flex:none}
  /* message health */
  .mh-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
  .mh-top .mt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .mh-top .mt b{display:block;font-size:20px;font-family:var(--font-display);line-height:1.1}
  .mh-top .mt span{font-size:11px;color:var(--ink-3)}
  .mh-top .mt.bad b{color:var(--danger)} .mh-top .mt.ok b{color:var(--ok)}
  .panelc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .bounce{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .bounce:first-of-type{border-top:0}
  .bounce .be{color:var(--ink-3);font-size:11px}
  .btn.mini{padding:5px 10px;font-size:12px;border-radius:9px}
  .grdacts{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}
  .rowi .rs-btn{margin-left:auto}
  #sendBody{font-size:14px}
  #sendBody label{display:block;margin:0 0 10px}
  #sendBody textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;min-height:90px;resize:vertical}
  #sendBody .chrow{display:flex;gap:8px;margin:0 0 10px}
  #sendBody .chip2{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:700;font-size:13px}
  #sendBody .chip2.on{border-color:var(--accent);color:var(--accent);background:rgba(245,197,24,.1)}
  #sendBody .prev{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 0;font-size:13px}
  #sendBody .prev .cnt{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--accent)}
  #sendBody .prev .samp{color:var(--ink-2);margin-top:6px;white-space:pre-wrap;line-height:1.4}
  #sendBody .hint{color:var(--ink-3);font-size:12px;margin:2px 0 0}
  /* black belt helpers by session */
  .bbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
  .bbcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .bbh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
  .bbh b{font-family:var(--font-display);font-size:15px}
  .bbc{font-weight:700;color:var(--ok);font-size:13px;flex:none}
  .bbc.full{color:var(--accent)}
  .bbnames{list-style:none;margin:0;padding:0}
  .bbnames li{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
  .bbnames li:first-child{border-top:0}
  .bbnames li small{color:var(--ink-3);font-size:11px;flex:none}
  .bbnames li .other{color:var(--ink-3)}
  /* tabs */
  .otabs{display:flex;gap:4px;overflow-x:auto;margin:16px 0 6px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .otabs::-webkit-scrollbar{display:none}
  .otab{flex:1 0 auto;white-space:nowrap;padding:9px 15px;border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
  .otab.on{background:var(--bg);color:var(--ink)}
  .otab .tb{background:var(--danger);color:#1a120d;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center}
  .tabwrap{padding:2px 0}
  .tabwrap > h2:first-child{margin-top:10px}
  .secbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  /* belt order */
  .beltgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .beltrow{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
  .beltrow .bsw{width:16px;height:16px;border-radius:5px;border:1px solid rgba(255,255,255,.25);flex:none}
  .beltrow .bnm{font-weight:700;flex:1;min-width:0}
  .beltrow .bn{font-family:var(--font-display);font-weight:700;font-size:20px;flex:none}
  .beltrow .bsub{flex-basis:100%;color:var(--ink-3);font-size:11px}
  /* countdown */
  .cdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .cdcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  .cdh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  .cdh b{font-family:var(--font-display)}
  .cdh .cdl{color:var(--ink-2);font-size:13px;flex:1;min-width:0}
  .cdh .cdu{color:var(--ink-3);font-size:12px}
  .cks{display:flex;flex-direction:column;gap:5px}
  .ck{font-size:13px;font-weight:600}
  .ck.ok{color:var(--ok)} .ck.no{color:var(--ink-3)}
  /* who's on today */
  .wot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
  .woth{display:flex;align-items:center;gap:8px;margin:0 0 7px}
  .woth b{font-family:var(--font-display);font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips .chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
  /* retest */
  .rbk{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
  .rbk.ok{background:rgba(127,214,162,.16);color:var(--ok)}
  .rbk.no{background:rgba(239,138,115,.16);color:var(--danger)}
  .tag.bad{background:rgba(239,138,115,.16);color:var(--danger)}
  /* bbc conversion */
  .bbconv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
  .bch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .bch b{font-family:var(--font-display);font-size:16px}
  .bch .bcp{font-family:var(--font-display);font-weight:700;color:var(--accent)}
  .bcbar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin:7px 0 0}
  .bcbar i{display:block;height:100%;background:var(--ok);border-radius:999px}
  /* group photo modal */
  .phform{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .phrow{display:flex;flex-direction:column;gap:5px}
  .phlbl{font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .phlbl2{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600}
  .phform select, .phform input[type=text], #phLabel{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
  .phform input[type=file]{font:inherit;color:var(--ink-2);font-size:13px}
  .phitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .phitem:first-child{border-top:0}
  .phitem small{color:var(--ink-3)}
  /* pinned notes */
  .noteadd{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
  .noteadd select, .noteadd input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
  .noteadd input{flex:1;min-width:160px}
  .noteitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 11px;margin:0 0 7px}
  .noteitem .nmeta{color:var(--ink-3);font-size:12px;flex:none}
  .noteitem .ntext{flex:1;min-width:0}
  .noterm{flex:none;background:transparent;border:0;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
  .noterm:hover{color:var(--danger)}
  .gnotes{display:flex;flex-direction:column;gap:4px;margin:8px 0 0}
  .gnote{font-size:13px;color:var(--ink);background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:5px 10px}
  /* find a student */
  #searchWrap{margin:0 0 6px}
  #opsSearch{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 15px;font:inherit;font-size:15px}
  #opsSearch:focus{outline:2px solid var(--accent);outline-offset:1px}
  .scard2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
  .sc2h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sc2h b{font-family:var(--font-display);font-size:16px}
  .sc2m{color:var(--ink-2);font-size:13px;margin:3px 0 0}
  .sc2s{color:var(--ink-3);font-size:12px;margin:4px 0 0}
  .tag.ok{background:rgba(127,214,162,.16);color:var(--ok)}
  .loading{padding:40px;text-align:center;color:var(--ink-3)}
</style>
</head>
<body>

<section class="auth" id="authView" hidden>
  <div class="card">
    <h2 style="margin-top:0">AMA Operations</h2>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
      <p class="muted" id="loginError" style="color:var(--danger)" hidden></p>
      <button type="submit" class="btn primary" id="loginBtn">Sign in</button>
    </form>
  </div>
</section>

<section class="auth" id="noAccessView" hidden>
  <div class="card"><h2 style="margin-top:0">No access</h2><p>Your login (<strong id="noAccessWho"></strong>) doesn't have Operations access. Ask an admin to tick <strong>Operations dashboard</strong> for you in Coloured Belts.</p><button class="btn" id="noAccessOut">Sign out</button></div>
</section>

<main class="wrap" id="appView" hidden>
  <header class="appbar"><div class="appbar-inner">
    <a class="home-btn" href="/grading/" aria-label="Back to Grading" title="Grading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg></a>
    <h1>Operations</h1>
    <span class="sp" style="flex:1"></span>
    <span class="muted" id="updated"></span>
    <button class="btn" id="refreshBtn">↻ Refresh</button>
    <button class="btn" id="signOutBtn">Sign out</button>
  </div></header>

  <div id="searchWrap"><input id="opsSearch" type="search" placeholder="Find a student…" autocomplete="off" aria-label="Find a student"></div>
  <div id="searchResults" hidden></div>
  <div id="board"><div class="loading">Loading…</div></div>
</main>

<div class="reqmodal" id="reqModal" hidden>
  <div class="reqbox">
    <h3 id="reqModalTitle">Request</h3>
    <form id="reqForm" autocomplete="off">
      <label id="reqGradWrap">Grading<select id="reqGrad"></select></label>
      <label><span id="reqMainLbl">What you need</span><input id="reqMain" maxlength="200" required></label>
      <label>Details <span class="muted">(optional)</span><textarea id="reqDetails" rows="3" maxlength="2000"></textarea></label>
      <div class="reqerr" id="reqErr" hidden></div>
      <div class="reqact"><button type="button" class="btn" id="reqCancel">Cancel</button><button type="submit" class="btn primary" id="reqSubmit">Send to Mark</button></div>
    </form>
  </div>
</div>

<div class="reqmodal" id="rosterModal" hidden>
  <div class="reqbox rbox">
    <div class="rhead"><div><h3 id="roTitle">Roster</h3><div class="muted" id="roSub"></div></div><span id="roStatus"></span></div>
    <div id="roSlots"></div>
    <div class="roadd"><button type="button" class="btn mini" data-addrole="floor">+ Floor staff</button><button type="button" class="btn mini" data-addrole="admin">+ Admin</button></div>
    <label>Note for Mark <span class="muted">(optional)</span><textarea id="roNote" rows="2" maxlength="2000"></textarea></label>
    <div class="rodec" id="roDec" hidden></div>
    <div class="reqerr" id="roErr" hidden></div>
    <div class="reqact" id="roActs"></div>
    <datalist id="roPeople"></datalist>
  </div>
</div>

<div class="reqmodal" id="rsetModal" hidden><div class="reqbox"></div></div>

<div class="reqmodal" id="sendModal" hidden>
  <div class="reqbox">
    <h3 id="sendTitle">Send</h3>
    <div id="sendBody"></div>
    <div class="reqerr" id="sendErr" hidden></div>
    <div class="reqact"><button type="button" class="btn" id="sendCancel">Cancel</button><button type="button" class="btn primary" id="sendGo" disabled>Send</button></div>
  </div>
</div>

<div class="reqmodal" id="photoModal" hidden>
  <div class="reqbox">
    <h3 id="photoTitle">Group photos</h3>
    <div id="photoList" class="muted">Loading…</div>
    <div class="phform">
      <div class="phrow"><span class="phlbl">Who's in it</span>
        <div class="chrow" id="phScope"><button type="button" class="chip2 on" data-sc="belt">One belt</button><button type="button" class="chip2" data-sc="range">Belt range</button><button type="button" class="chip2" data-sc="session">Whole session</button></div>
      </div>
      <div class="phrow" id="phBeltOne"><label class="phlbl2">Belt<select id="phBelt"></select></label></div>
      <div class="phrow" id="phBeltRange" hidden style="display:flex;gap:8px"><label class="phlbl2" style="flex:1">From<select id="phFrom"></select></label><label class="phlbl2" style="flex:1">To<select id="phTo"></select></label></div>
      <div class="phrow"><label class="phlbl2">Label (optional)<input id="phLabel" maxlength="80" placeholder="e.g. New Yellow Belts"></label></div>
      <div class="phrow"><label class="phlbl2">Photo<input id="phFile" type="file" accept="image/jpeg,image/png,image/webp"></label></div>
    </div>
    <div class="reqerr" id="photoErr" hidden></div>
    <div class="reqact"><button type="button" class="btn" id="photoClose">Close</button><button type="button" class="btn primary" id="photoUp" disabled>Upload photo</button></div>
  </div>
</div>

<script>
const CFG = window.TOOLKIT_CONFIG || {};
let sb, DATA = null, started = false, openKey = null, loc = null, prog = null;
let me = '', myPerms = [], isAdmin = false, busy = false, BBSESS = [], DATA2 = null, NOTES = [], ROSTERS = [], RSET = null;
const OTABS = [['today','Today'],['action','Needs action'],['gradings','Gradings'],['helpers','Helpers'],['reports','Reports']];
let OTAB = (()=>{ try{ const h = location.hash.replace('#',''); return OTABS.some(t=>t[0]===h) ? h : (localStorage.getItem('ops_tab')||'today'); }catch(e){ return 'today'; } })();
function setTab(t){ OTAB = t; openKey = null; try{ localStorage.setItem('ops_tab', t); history.replaceState(null,'','#'+t); }catch(e){} render(); }
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso + 'T00:00:00'); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; }
function ago(n){ n = +n; return n <= 0 ? 'today' : n === 1 ? '1 day' : n + ' days'; }
function until(n){ n = +n; return n <= 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; }

function showView(w){ $('#authView').hidden = w !== 'auth'; $('#noAccessView').hidden = w !== 'noaccess'; $('#appView').hidden = w !== 'app'; }

async function load(){
  $('#refreshBtn').disabled = true;
  try{
    const [{ data, error }, bb, d2, nt, ro, rs] = await Promise.all([
      sb.rpc('cb_ops_dashboard'),
      sb.rpc('cb_ops_bb_sessions').then(r => r, () => ({ data: [] })),
      sb.rpc('cb_ops_dashboard2').then(r => r, () => ({ data: null })),
      sb.rpc('cb_ops_day_notes').then(r => r, () => ({ data: [] })),
      sb.rpc('cb_ops_rosters').then(r => r, () => ({ data: [] })),
      sb.rpc('cb_ops_roster_settings').then(r => r, () => ({ data: null }))
    ]);
    if(error) throw error;
    BBSESS = (bb && bb.data) || [];
    DATA2 = (d2 && d2.data) || null;
    NOTES = (nt && nt.data) || [];
    ROSTERS = (ro && ro.data) || [];
    RSET = (rs && rs.data) || RSET || { floor_need: 2, floor_max: 4, admin_need: 1, admin_max: 2, floor_before: 30, floor_hours: 3, admin_before: 30, admin_hours: 3 };
    DATA = data; render();
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }catch(e){ $('#board').innerHTML = `<div class="loading" style="color:var(--danger)">Couldn't load: ${esc(e.message||e)}</div>`; }
  $('#refreshBtn').disabled = false;
}

function tile(key, n, label, sub, tone){
  const z = !n ? ' zero' : '';
  return `<button class="tile ${tone||''}${z}" data-key="${key}" aria-expanded="${openKey===key}"><span class="n">${n}</span><span class="l">${label}</span>${sub?`<span class="s">${sub}</span>`:''}</button>`;
}

function detailFor(key){
  const d = DATA; if(!d) return '';
  const wrap = (title, rows, total, shown) => `<div class="detail"><h3>${esc(title)}</h3>${rows||'<div class="more">Nothing here — all clear.</div>'}${total>shown?`<div class="more">Showing ${shown} of ${total}.</div>`:''}</div>`;
  if(key === 'bbc'){ const it = d.bbc_actions.items;
    return wrap('Black Belt Club sign-ups — set up EFC payment + call to confirm DDR', it.map(x=>`<div class="rowi"><span class="nm">${esc(x.name||'—')}</span>${x.uniform?'<span class="tag">uniform</span>':''}<span class="meta">${x.phone?esc(x.phone)+' · ':''}waiting ${ago(x.waiting_days)}</span></div>`).join(''), d.bbc_actions.count, it.length); }
  if(key === 'errors'){ const it = d.booking_errors.items.filter(inFilt);
    return wrap('Booking errors (EFC booking failed)'+(loc?` — ${loc}`:''), it.map(x=>`<div class="rowi"><span class="nm">${esc(x.name||'—')}</span><span class="err">${esc(x.error||'')}</span><span class="meta">${esc(x.location||'')} · ${fmtDate(x.grading_date)}</span></div>`).join(''), ((loc||prog)?it.length:d.booking_errors.count), it.length); }
  if(key === 'msgs'){ const it = d.failed_messages.items;
    return wrap('Failed texts & emails (last 14 days)', it.map(x=>`<div class="rowi"><span class="nm">${esc(x.name||'—')}</span><span class="tag">${esc(x.channel)} · ${esc(x.kind||'')}</span><span class="meta">${esc((x.error||'').slice(0,50))}</span>${x.message_id?`<button class="btn mini rs-btn" data-resend="${x.message_id}" data-name="${esc(x.name||'')}">Resend</button>`:''}</div>`).join(''), d.failed_messages.count, it.length); }
  if(key === 'notbooked'){ const it = d.chase_not_booked.items.filter(inFilt);
    return wrap('Invited but not booked'+(loc?` — ${loc}`:''), it.map(x=>`<div class="rowi"><span class="nm">${esc(x.name||'—')}</span><span class="tag">→ ${esc((x.belt_to||'').replace(/ Belt$/,''))}</span><span class="meta">${esc(x.location||'')} · ${fmtDate(x.grading_date)} · invited ${ago(x.invited_days_ago)} ago</span></div>`).join(''), ((loc||prog)?it.length:d.chase_not_booked.count), it.length); }
  if(key === 'unpaid'){ const it = d.chase_unpaid.items.filter(inFilt);
    return wrap('Booked but not paid'+(loc?` — ${loc}`:''), it.map(x=>`<div class="rowi"><span class="nm">${esc(x.name||'—')}</span><span class="tag">→ ${esc((x.belt_to||'').replace(/ Belt$/,''))}</span><span class="meta">${esc(x.location||'')} · ${fmtDate(x.grading_date)}</span></div>`).join(''), ((loc||prog)?it.length:d.chase_unpaid.count), it.length); }
  return '';
}

const inFilt = x => (!loc || x.location === loc) && (!prog || x.programme === prog);
const progLabel = p => (p||'').replace(/^Taekwondo\s*-\s*/,'').trim() || p;   // "Taekwondo - Little Dragon" -> "Little Dragon"
function distinct(field){ const d = DATA, s = new Set();
  (d.gradings||[]).forEach(g=>g[field]&&s.add(g[field]));
  [d.booking_errors,d.chase_not_booked,d.chase_unpaid].forEach(b=>(b.items||[]).forEach(x=>x[field]&&s.add(x[field])));
  return [...s].sort(); }
function fmtTime(t){ if(!t) return ''; const p = String(t).split(':'); let H = +p[0]; const ap = H >= 12 ? 'pm' : 'am'; H = H % 12 || 12; return `${H}:${p[1]}${ap}`; }
function startOf(dayId){ const c = (DATA2 && DATA2.countdown || []).find(x => x.day_id === dayId); return c ? c.start_time : null; }
function grdCard(g){
  const pct = g.pct_booked == null ? 0 : +g.pct_booked;
  const t = fmtTime(startOf(g.day_id));
  const low = pct < 60 ? (pct < 35 ? ' vlow' : ' low') : '';
  const cap = g.helper_cap || 0, hs = g.helper_signups || 0;
  const helperLine = g.helper_open ? (hs < cap ? `<div class="hp need">Helpers: ${hs}/${cap} — needs ${cap-hs} more</div>` : `<div class="hp ok2">Helpers: ${hs}/${cap}</div>`) : (hs ? `<div class="hp ok2">Helpers: ${hs}</div>` : '');
  return `<div class="grd"><div class="gh"><span class="gd">${fmtDate(g.grading_date)}</span>${t?`<span class="gt">${t}</span>`:''}<span class="gl">${esc(g.location||'')}</span>${g.bb?'<span class="badge bb">BB</span>':''}${g.makeup?'<span class="badge mk">makeup</span>':''}<span class="gu">${until(g.days_until)}</span></div>`
    + `<div class="bar${low}"><i style="width:${Math.min(100,pct)}%"></i></div>`
    + `<div class="st"><span><b>${g.booked}</b>/${g.total} booked (${g.pct_booked==null?'—':g.pct_booked+'%'})</span><span><b>${g.paid}</b> paid</span>${g.not_booked?`<span><b>${g.not_booked}</b> not booked</span>`:''}</div>`
    + helperLine
    + (notesForDay(g.day_id).length ? `<div class="gnotes">${notesForDay(g.day_id).map(n=>`<div class="gnote">${esc(n.note)}</div>`).join('')}</div>` : '')
    + `<div class="grdacts">${rosterBtn(g)}${hs?`<button class="btn mini" data-remind="${g.day_id}" data-loc="${esc(g.location||'')}">Remind ${hs} helper${hs>1?'s':''}</button>`:''}${(isAdmin&&g.booked)?`<button class="btn mini" data-announce="${g.day_id}" data-loc="${esc(g.location||'')}">Message families</button>`:''}${g.bb?'':`<button class="btn mini" data-photos="${g.day_id}" data-loc="${esc(g.location||'')}">Group photos</button>`}</div>`
    + `</div>`;
}
// #15 live grading-day board: checked-in vs expected, and results coming in
function liveBoard(rows){
  return `<div class="today live"><div class="th">Live now · ${rows.length} grading${rows.length>1?'s':''}</div>`
    + rows.map(g=>{ const bk=g.booked||0, ci=g.checked_in||0, gd=g.graded||0;
        return `<div class="live-grd${g.running?' running':''}"><div class="lgh"><span class="gd">${fmtDate(g.grading_date)}</span><span class="gl">${esc(g.location||'')}</span>${g.bb?'<span class="badge bb">BB</span>':''}${g.running?'<span class="badge mk">running</span>':''}</div>`
          + `<div class="live-stats"><div class="ls ${bk&&ci<bk?'warn':'ok'}"><b>${ci}/${bk}</b><span>checked in</span></div><div class="ls"><b>${gd}/${bk}</b><span>graded</span></div><div class="ls ok"><b>${g.passed||0}</b><span>passed${g.failed?` · ${g.failed} fail`:''}</span></div></div></div>`;
      }).join('') + `</div>`;
}
// #13 month calendar of gradings across schools, colour-coded by status
let calOff = 0;
function isoLocal(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function calendarSection(){
  const evs = (DATA.calendar||[]).filter(inFilt);
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+calOff);
  const y = base.getFullYear(), m = base.getMonth();
  const start = new Date(y, m, 1 - new Date(y,m,1).getDay());   // Sunday on/ before the 1st
  const today = new Date(); today.setHours(0,0,0,0);
  const byDate = {}; evs.forEach(e=>{ (byDate[e.grading_date]=byDate[e.grading_date]||[]).push(e); });
  let cells = '';
  for(let i=0;i<42;i++){ const dt = new Date(start); dt.setDate(start.getDate()+i);
    const iso = isoLocal(dt), out = dt.getMonth()!==m, isT = dt.getTime()===today.getTime();
    const es = (byDate[iso]||[]).map(e=>`<span class="ev ${esc(e.status)}" title="${esc(e.location||'')} — ${e.booked}/${e.total} booked">${esc((e.location||'').slice(0,9))}${e.bb?' BB':''}</span>`).join('');
    cells += `<div class="cell${out?' out':''}${isT?' today':''}"><span class="dn">${dt.getDate()}</span>${es}</div>`;
  }
  const mn = base.toLocaleDateString([], { month:'long', year:'numeric' });
  const dow = ['S','M','T','W','T','F','S'].map(x=>`<div class="dow">${x}</div>`).join('');
  return `<div class="calbar"><div class="caltitle"><h2>Calendar</h2><span class="calmon">${esc(mn)}</span></div><div class="calnav"><button class="btn" id="calPrev" aria-label="Previous month">‹</button><button class="btn" id="calToday">Today</button><button class="btn" id="calNext" aria-label="Next month">›</button></div></div>
    <div class="cal">${dow}${cells}</div>
    <div class="callegend"><span><i style="background:var(--accent)"></i>Scheduled</span><span><i style="background:var(--ok)"></i>Running</span><span><i style="background:var(--ink-2)"></i>Done</span><span><i style="background:var(--danger)"></i>Past · not closed</span></div>`;
}
// #16 recent results + who to rebook
function resultsSection(){
  const rr = DATA.results_recent; if(!rr) return '';
  const days = (rr.days||[]).filter(inFilt), reb = (rr.rebook||[]).filter(inFilt);
  if(!days.length && !reb.length) return '';
  return `<h2>Recent results</h2>`

async function addNote(){

function limitsOf(dayId){ const r = rosterOf(dayId), d = RSET || {};
  const def = { floor: { need: d.floor_need ?? 2, max: d.floor_max ?? 4 }, admin: { need: d.admin_need ?? 1, max: d.admin_max ?? 2 } };
  const l = (r && r.limits) || {}; return { floor: { ...def.floor, ...(l.floor || {}) }, admin: { ...def.admin, ...(l.admin || {}) } }; }

function defTimes(role, dayId){ const st = startOf(dayId); if(!st) return { start: '', end: '' };
  const [h, m] = String(st).split(':').map(Number), d = RSET || {}, before = +(d[role + '_before'] ?? 30), hrs = +(d[role + '_hours'] ?? 3);

const cleanSlots = () => RO.slots.filter(x => (x.name || '').trim()).map(x => ({ role: x.role, start: x.start || '', end: x.end || '', name: x.name.trim(), mobile: (x.mobile || '').trim(), email: x.email || null, helper_id: x.helper_id || null, deputy_id: x.deputy_id || null, deputy_emp: x.deputy_emp || null }));
async function saveRoster(submit, btn){
  const slots = cleanSlots();
  if(submit && !slots.length) return roErr('Add at least one person.');
  const shortBy = ['floor', 'admin'].map(r => [r, RO.lim[r].need - slots.filter(x => x.role === r).length]).filter(([, n]) => n > 0);
  if(submit && shortBy.length && !RO.warned){ RO.warned = true; return roErr(`Still short: ${shortBy.map(([r, n]) => `${n} ${r === 'floor' ? 'floor staff' : 'admin'}`).join(' and ')}. Tap Send again to send it anyway.`); }
  btn.disabled = true; roErr('');
  if(RO.limDirty){ const l = await sb.rpc('cb_ops_roster_limits', { p_day_id: RO.day_id, p_limits: RO.lim }); if(l.error){ btn.disabled = false; return roErr('Not saved: ' + l.error.message); } }
  const { error } = await sb.rpc('cb_ops_roster_save', { p_day_id: RO.day_id, p_slots: slots, p_note: $('#roNote').value.trim() || null, p_submit: !!submit });
  btn.disabled = false;
  if(error) return roErr('Not saved: ' + (error.message || 'try again'));
  closeRoster(); await load();
}
async function decideRoster(status, btn){
  btn.disabled = true; roErr('');
  const slots = cleanSlots();
  if(RO.limDirty){ const l = await sb.rpc('cb_ops_roster_limits', { p_day_id: RO.day_id, p_limits: RO.lim }); if(l.error){ btn.disabled = false; return roErr('Not saved: ' + l.error.message); } }
  if(!RO.r || !(RO.r.slots||[]).length){ const s1 = await sb.rpc('cb_ops_roster_save', { p_day_id: RO.day_id, p_slots: slots, p_note: $('#roNote').value.trim() || null, p_submit: false }); if(s1.error){ btn.disabled = false; return roErr('Not saved: ' + s1.error.message); } }
  const { data, error } = await sb.rpc('cb_ops_roster_decide', { p_day_id: RO.day_id, p_status: status, p_note: status === 'declined' ? ($('#roNote').value.trim() || null) : null, p_slots: slots });
  btn.disabled = false;
  if(error || (data && data.error)) return roErr('Not saved: ' + ((error && error.message) || data.error));
  await load();
  if(status === 'approved'){ RO.r = rosterOf(RO.day_id); $('#roStatus').innerHTML = roTag(RO.r); drawRoActs(); roErr(''); deputyRoster(null); }
  else closeRoster();
}
// approved: make each person's shift in Deputy (published, so Deputy tells them too)
async function deputyRoster(btn, opunit){
  if(btn){ btn.disabled = true; btn.textContent = 'Adding…'; }
  roErr('Adding the shifts to Deputy…');
  try{
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/cb', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify({ action: 'roster_deputy', day_id: RO.day_id, opunit_id: opunit || undefined }) });
    const j = await r.json().catch(() => ({}));
    if(j.pick_area){
      roErr('');
      $('#roDec').hidden = false;
      $('#roDec').innerHTML = `Which Deputy area should these shifts go in?<select id="roArea" style="display:block;width:100%;margin:8px 0">${(j.areas||[]).map(a => `<option value="${a.id}">${esc(a.name)}${a.location ? ' · ' + esc(a.location) : ''}</option>`).join('')}</select><button type="button" class="btn primary mini" id="roAreaGo">Add to Deputy</button>`;
      $('#roAreaGo').onclick = () => { const v = $('#roArea').value; $('#roDec').hidden = true; deputyRoster(null, v); };
      if(btn){ btn.disabled = false; btn.textContent = 'Add to Deputy'; }
      return;
    }
    if(!r.ok || j.error) throw new Error(j.error || 'Not added');
    const bad = (j.results || []).filter(x => x.status !== 'shift made' && x.status !== 'already in Deputy');
    await load(); RO.r = rosterOf(RO.day_id); if(RO.r) RO.slots = JSON.parse(JSON.stringify(RO.r.slots || [])); $('#roStatus').innerHTML = roTag(RO.r); drawRoActs();
    roErr(`Deputy (${j.area}): ${j.made} shift${j.made === 1 ? '' : 's'} made${bad.length ? `. Not added: ${bad.map(x => x.name + ' (' + (x.error || x.status) + ')').join(', ')}` : ''}`);
  }catch(e){ if(btn){ btn.disabled = false; btn.textContent = 'Add to Deputy'; } roErr(String(e.message || e)); }
}
// Roster defaults (Mark): needed / max per grading, and each shift's usual times
function openRset(){
  const d = RSET || {}, n = (k, v, step, min) => `<input type="number" id="rs_${k}" value="${v}" step="${step||1}" min="${min ?? 0}">`;
  const box = $('#rsetModal');
  box.querySelector('.reqbox').innerHTML = `<h3>Roster defaults</h3>
    <p class="muted" style="margin:-6px 0 14px;font-size:13px">Used for every grading unless that grading's roster sets its own numbers.</p>
    <div class="roh" style="margin-top:0">Floor staff</div>
    <div class="rsgrid"><label>Needed${n('floor_need', d.floor_need)}</label><label>Most${n('floor_max', d.floor_max)}</label><label>Start (min before)${n('floor_before', d.floor_before, 5, -600)}</label><label>Length (hours)${n('floor_hours', d.floor_hours, 0.25, 0.25)}</label></div>
    <div class="roh">Admin</div>
    <div class="rsgrid"><label>Needed${n('admin_need', d.admin_need)}</label><label>Most${n('admin_max', d.admin_max)}</label><label>Start (min before)${n('admin_before', d.admin_before, 5, -600)}</label><label>Length (hours)${n('admin_hours', d.admin_hours, 0.25, 0.25)}</label></div>
    <p class="muted" style="font-size:12px;margin:4px 0 12px">Example: a grading at 9:00am with "30 min before" and "3 hours" gives shifts of 8:30am to 11:30am.</p>
    <div class="reqerr" id="rsErr" hidden></div>
    <div class="reqact"><button type="button" class="btn" id="rsCancel">Cancel</button><button type="button" class="btn primary" id="rsSave">Save defaults</button></div>`;
  box.hidden = false;
  $('#rsCancel').onclick = () => { box.hidden = true; };
  $('#rsSave').onclick = async () => {
    const p = {}; ['floor_need','floor_max','admin_need','admin_max','floor_before','floor_hours','admin_before','admin_hours'].forEach(k => p[k] = $('#rs_' + k).value);
    if(+p.floor_max < +p.floor_need || +p.admin_max < +p.admin_need){ const e = $('#rsErr'); e.textContent = 'Most has to be at least the number needed.'; e.hidden = false; return; }
    const { data, error } = await sb.rpc('cb_ops_roster_settings_set', { p });
    if(error){ const e = $('#rsErr'); e.textContent = 'Not saved: ' + error.message; e.hidden = false; return; }
    RSET = data; box.hidden = true; render();
  };
}
async function textRoster(btn){
  btn.disabled = true; btn.textContent = 'Sending…'; roErr('');
  try{
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/cb', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify({ action: 'roster_notify', day_id: RO.day_id }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok || j.error) throw new Error(j.error || 'Not sent');
    const bad = (j.results || []).filter(x => x.status !== 'sent');
    await load(); RO.r = rosterOf(RO.day_id); $('#roStatus').innerHTML = roTag(RO.r); drawRoActs();
    roErr(`Texted ${j.sent}${bad.length ? `. Not sent: ${bad.map(x => x.name + ' (' + (x.error || x.status) + ')').join(', ')}` : ''}`);
  }catch(e){ btn.disabled = false; btn.textContent = 'Text everyone their shift'; roErr(String(e.message || e)); }
}
async function resolveReq(id, status){
  if(busy) return; busy = true;
  const { error } = await sb.rpc('cb_ops_request_resolve', { p_request_id: id, p_status: status, p_resolution: null });
  busy = false;
  if(error){ alert('Could not update — ' + (error.message || 'please try again')); return; }
  await load();
}

(function boot(){
  if(!window.supabase || !CFG.SUPABASE_URL){ document.body.innerHTML = '<p style="padding:40px">Not connected to the database (config.js).</p>'; return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, { auth: { lock:(()=>{let q=Promise.resolve();return(n,t,f)=>{const r=q.then(f,f);q=r.catch(()=>{});return r;};})() } });
  const hub = { sb, url: CFG.SUPABASE_URL, key: CFG.SUPABASE_KEY, form: '#loginForm', onSignedIn: () => {} };
  if(window.AmaHub){ AmaHub.mount(hub); AmaHub.recheck(hub); }
  sb.auth.onAuthStateChange((event, session) => {
    if(session) setTimeout(() => startApp(session), 0);
    else if(!started) showView('auth');
    else location.reload();
  });
})();
</script>
