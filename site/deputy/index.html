<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connect Deputy · AMA</title>
<link rel="icon" href="/icons/ama-logo.png">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1713; color: #edf2ee; font: 17px/1.5 "Segoe UI", Arial, sans-serif; padding: 20px; box-sizing: border-box; }
  .box { max-width: 420px; text-align: center; }
  img { width: 48px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #a3b5a9; margin: 0 0 18px; }
  a { display: inline-block; background: #f5c518; color: #14130a; font-weight: 700; text-decoration: none; padding: 12px 20px; border-radius: 12px; }
  .bad { color: #ef8a73; }
</style>
</head>
<body>
<div class="box"><img src="/icons/ama-logo.png" alt=""><h1 id="t">Connecting Deputy…</h1><p id="p">One moment.</p><a href="/admin/#rosters" id="back" hidden>Back to Operations</a></div>
<script>
// Deputy sends people back here with ?code=… after they approve AMA's access; this hands the code to the server, which keeps the sign-in.
(async function () {
  var CFG = window.TOOLKIT_CONFIG || {}, q = new URLSearchParams(location.search), code = q.get('code'), err = q.get('error');
  var show = function (t, p, bad) { document.getElementById('t').textContent = t; var el = document.getElementById('p'); el.textContent = p; el.className = bad ? 'bad' : ''; document.getElementById('back').hidden = false; };
  if (err || !code) return show('Deputy was not connected', err ? 'Deputy said: ' + err : 'No approval came back from Deputy. Try Connect Deputy again.', true);
  try {
    var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return show('Sign in first', 'Open Operations, sign in, then tap Connect Deputy again.', true);
    var r = await fetch(CFG.SUPABASE_URL + '/functions/v1/cb', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token }, body: JSON.stringify({ action: 'deputy_connect', code: code }) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok || !j.ok) return show('Deputy was not connected', j.error || 'Please try again.', true);
    history.replaceState(null, '', '/deputy/');
    show('Deputy is connected', 'Rosters can now read usual shifts, add shifts and show wages.' + (j.endpoint ? ' (' + j.endpoint + ')' : ''));
  } catch (e) { show('Deputy was not connected', String(e.message || e), true); }
})();
</script>
</body>
</html>
