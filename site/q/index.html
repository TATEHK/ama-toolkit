<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1713">
<link rel="icon" href="../icons/ama-id-cards.png">
<script src="../config.js"></script>
<title>AMA Theory Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#0f1713;--panel:#15201a;--raise:#1b2821;--line:#253629;--line2:#31473a;--ink:#edf2ee;--ink-2:#a3b5a9;--accent:#f5c518;--ok:#2f9e5b;--display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Barlow,"Segoe UI",Arial,sans-serif;min-height:100%}
main{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);margin:0}
.top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--display)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#14130a;display:grid;place-items:center;font:700 16px var(--display)}
.grow{flex:1}
.time{font:700 22px var(--display);color:var(--accent)} .time.low{color:#ef8a73}
.btn{border:0;border-radius:14px;padding:14px 16px;font:700 17px Barlow,sans-serif;background:var(--accent);color:#14130a;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn:disabled{opacity:.4}
input{font:700 28px var(--display);letter-spacing:.2em;text-transform:uppercase;text-align:center;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.names{display:flex;flex-direction:column;gap:8px}
.names button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font:600 18px Barlow,sans-serif;color:var(--ink)}
.names button small{color:var(--ink-2);font-weight:500}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
.big{font:700 32px/1.1 var(--display)}
.muted{color:var(--ink-2)}
.qhead{display:flex;justify-content:space-between;color:var(--ink-2);font:700 15px var(--display)}
.qtext{font:700 25px/1.2 var(--display)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line2);color:var(--ink);border-radius:14px;padding:15px;font:600 19px/1.25 Barlow,sans-serif;text-align:left;display:flex;gap:12px;align-items:center}
.opt i{font-style:normal;font:700 16px var(--display);border:2px solid var(--line2);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.opt.on{border-color:var(--accent);background:#2a2610}.opt.on i{background:var(--accent);border-color:var(--accent);color:#14130a}
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{background:var(--panel);border:2px solid var(--line2);color:var(--ink);border-radius:14px;padding:14px;font:600 18px Barlow,sans-serif;text-align:left;display:flex;gap:10px;align-items:center}
.ord button b{border:2px solid var(--line2);border-radius:8px;min-width:32px;height:30px;display:grid;place-items:center;font:700 16px var(--display)}
.ord button.used{border-color:var(--accent)} .ord button.used b{background:var(--accent);border-color:var(--accent);color:#14130a}
.nav{display:flex;gap:10px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dots button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line2);background:transparent;color:var(--ink-2);font:700 13px var(--display);padding:0}
.dots button.done{background:#173a26;border-color:var(--ok);color:#bfe8cf}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
.saved{font-size:13px;color:var(--ink-2);text-align:center;min-height:18px}
.err{color:#ef8a73;text-align:center}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:16px;padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
</style>
</head>
<body>
<main id="m"><div class="center"><p class="muted">Loading…</p></div></main>
<dialog id="dlg"></dialog>
<script>
const CFG = window.TOOLKIT_CONFIG || {};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const newToken = () => { const b = crypto.getRandomValues(new Uint8Array(24)); return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const mmss = s => Math.floor(s / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
let [CODE, TAB] = (location.hash || '').slice(1).split('/');
CODE = (CODE || ls('ama_quiz_code') || '').toUpperCase();
let TOKEN = null, ST = null, QS = null, ANS = {}, cur = 0, timer = null, view = '', savedMsg = '', REDO = null;
const list = () => REDO ? QS.filter(q => REDO.includes(q.ix)) : QS;   // when redoing, only the questions that were wrong
const brand = `<div class="brand"><div class="logo">A</div>Theory test</div>`;
async function call(body) {
  try {
    const r = await fetch(CFG.SUPABASE_URL + '/functions/v1/gevent', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({ ok: false, error: 'No connection. Trying again…' })); j.status = r.status; return j;
  } catch (e) { return { ok: false, offline: true, error: 'No connection. Check your internet.' }; }
}
function askCode(msg) {
  view = 'code';
  $('#m').innerHTML = `<div class="top">${brand}</div><div class="center"><div class="big">Sign in to the test</div><p class="muted">Type the code on the big screen</p>
    <input id="code" maxlength="12" autocomplete="off" autocapitalize="characters" value="${esc(CODE)}"><button class="btn" id="go">Continue</button>${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
  $('#go').onclick = () => { CODE = $('#code').value.trim().toUpperCase(); start(); };
  $('#code').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
}
async function start() {
  if (!CODE) return askCode();
  ls('ama_quiz_code', CODE);
  if (TAB) { TOKEN = TAB; ls('ama_quiz_tok_' + CODE, TOKEN); TAB = null; try { history.replaceState(null, '', '#' + CODE); } catch (e) {} return run(); }
  TOKEN = ls('ama_quiz_tok_' + CODE);
  if (TOKEN) { const s = await call({ action: 'state', code: CODE, token: TOKEN }); if (s.ok) return run(); }
  const j = await call({ action: 'join', code: CODE });
  if (!j.ok) return askCode(j.error);
  view = 'names';
  $('#m').innerHTML = `<div class="top">${brand}</div><div><div class="big">${esc(j.title)}</div><p class="muted">Tap your name</p></div>
    <div class="names">${j.players.map(p => `<button data-id="${p.id}" data-n="${esc(p.name)}">${esc(p.name)} ${p.taken ? '<small>· signed in</small>' : ''}</button>`).join('')}</div>`;
  $$('[data-id]').forEach(b => b.onclick = () => claim(b.dataset.id, b.dataset.n));
}
async function claim(id, name, force) {
  TOKEN = ls('ama_quiz_tok_' + CODE) || newToken();
  const r = await call({ action: 'claim', code: CODE, cand_id: id, token: TOKEN, force: !!force });
  if (r.taken) { if (confirm(`${name} is already signed in on another device. Use this one instead?`)) return claim(id, name, true); return; }
  if (!r.ok) return alert(r.error || 'Try again.');
  ls('ama_quiz_tok_' + CODE, TOKEN); run();
}
function run() { clearInterval(timer); poll(); timer = setInterval(poll, 3000); }
async function poll() {
  const s = await call({ action: 'state', code: CODE, token: TOKEN, with_questions: !QS });
  if (!s.ok) { if (s.rejoin) { ls('ama_quiz_tok_' + CODE, null); clearInterval(timer); return start(); } return; }
  s.at = Date.now(); ST = s;
  if (s.questions) QS = s.questions;
  if (view !== 'test') { if (s.answers) ANS = { ...s.answers }; REDO = s.redo || null; }
  draw();
}
setInterval(() => { const el = $('#left'); if (!el || !ST) return; const left = Math.max(0, Math.round((ST.ends_in_ms - (Date.now() - ST.at)) / 1000)); el.textContent = mmss(left); el.classList.toggle('low', left < 120); }, 500);
function draw() {
  const s = ST, me = esc((s.me.name || '').split(' ')[0]);
  if (s.submitted) return page('done', `<div class="top">${brand}</div><div class="center"><div class="big">All ${s.total} right</div><p class="muted">Well done, ${me}. Your theory test is complete. You can put your phone away.</p></div>`);
  if (s.phase === 'ended') return page('ended', `<div class="top">${brand}</div><div class="center"><div class="big">Time is up</div><p class="muted">Thanks, ${me}. Your answers have been handed in. The panel will talk to you about your result.</p></div>`);
  if (s.phase !== 'open' || !QS) return page('wait', `<div class="top">${brand}</div><div class="center"><div class="big">You're signed in, ${me}</div><p class="muted">The test starts when the panel says go: ${s.total} questions, ${s.minutes} minutes, at your own pace. You can go back and change answers until you submit. To pass you need every answer right; if any are wrong you'll be asked to redo just those.</p>
      <button class="btn ghost" id="notme" style="width:auto">Not ${me}? Change name</button></div>`, () => { $('#notme').onclick = () => { ls('ama_quiz_tok_' + CODE, null); clearInterval(timer); QS = null; view = ''; start(); }; });
  if (view !== 'test') { view = 'test'; drawQ(); }
}
function page(v, html, wire) { if (view === v) return; view = v; $('#m').innerHTML = html; wire && wire(); }
const isDone = q => ANS[q.ix] != null && !(Array.isArray(ANS[q.ix]) && ANS[q.ix].length !== q.options.length);
function drawQ() {
  const L = list(); if (cur >= L.length) cur = 0;
  const q = L[cur], a = ANS[q.ix], n = L.filter(isDone).length;
  let opts;
  if (q.type === 'order') {
    const ord = Array.isArray(a) ? a : [];
    opts = `<p class="muted" style="margin:0">Tap them in order, earliest first. Tap Clear to start again.</p><div class="ord">${q.options.map((o, i) => { const at = ord.indexOf(i); return `<button data-o="${i}" class="${at >= 0 ? 'used' : ''}"><b>${at >= 0 ? at + 1 : ''}</b>${esc(o)}</button>`; }).join('')}</div>
      <button class="btn ghost" id="clr" style="padding:10px">Clear</button>`;
  } else opts = `<div class="opts">${q.options.map((o, i) => `<button class="opt ${a != null && Number(a) === i ? 'on' : ''}" data-a="${i}"><i>${q.type === 'tf' ? (i ? 'F' : 'T') : 'ABCD'[i]}</i>${esc(o)}</button>`).join('')}</div>`;
  $('#m').innerHTML = `<div class="top">${brand}<span class="grow"></span><span class="time" id="left"></span></div>
    ${REDO ? `<div class="saved" style="color:var(--accent);font-weight:700;text-align:left">Redo: ${L.length} question${L.length === 1 ? '' : 's'} to answer again. Your other answers are right.</div>` : ''}
    <div class="qhead"><span>Question ${q.ix + 1} of ${QS.length}${q.section ? ' · ' + esc(q.section) : ''}</span><span>${n} of ${L.length} answered</span></div>
    <div class="qtext">${esc(q.text)}</div>${opts}<div class="saved" id="saved">${esc(savedMsg)}</div>
    <div class="nav"><button class="btn ghost" id="prev" ${cur ? '' : 'disabled'}>Back</button>${cur < L.length - 1 ? '<button class="btn" id="next">Next</button>' : '<button class="btn sub">Review and submit</button>'}</div>
    <div class="dots">${L.map((x, i) => `<button data-j="${i}" class="${isDone(x) ? 'done' : ''} ${i === cur ? 'cur' : ''}">${x.ix + 1}</button>`).join('')}</div>
    ${cur < L.length - 1 ? '<button class="btn ghost sub">Submit test</button>' : ''}`;
  savedMsg = '';
  $$('[data-a]').forEach(b => b.onclick = () => save(q.ix, +b.dataset.a));
  $$('[data-o]').forEach(b => b.onclick = () => { const ord = Array.isArray(ANS[q.ix]) ? ANS[q.ix].slice() : []; const i = +b.dataset.o; if (ord.includes(i)) return; ord.push(i); ANS[q.ix] = ord; if (ord.length === q.options.length) save(q.ix, ord); else drawQ(); });
  const c = $('#clr'); if (c) c.onclick = () => save(q.ix, null);
  $('#prev').onclick = () => { if (cur) { cur--; drawQ(); } };
  const nx = $('#next'); if (nx) nx.onclick = () => { cur++; drawQ(); };
  $$('[data-j]').forEach(b => b.onclick = () => { cur = +b.dataset.j; drawQ(); });
  $$('.sub').forEach(b => b.onclick = review);
  const el = $('#left'); if (el && ST) el.textContent = mmss(Math.max(0, Math.round((ST.ends_in_ms - (Date.now() - ST.at)) / 1000)));
}
async function save(ix, ans) {
  if (ans === null) delete ANS[ix]; else ANS[ix] = ans;
  savedMsg = 'Saving…'; drawQ();
  const r = await call({ action: 'answer', code: CODE, token: TOKEN, q_ix: ix, answer: ans });
  const el = $('#saved');
  if (r.ok) { if (el) el.textContent = 'Saved'; }
  else { if (el) el.textContent = r.error || 'Not saved. Try again.'; if (r.status === 409) { view = ''; poll(); } }
}
function review() {
  const missing = list().filter(q => !isDone(q)).map(q => q.ix + 1);
  const d = $('#dlg');
  d.innerHTML = `<h2>${REDO ? 'Submit your redo?' : 'Submit your test?'}</h2><p class="muted">${missing.length ? `You haven't answered question${missing.length > 1 ? 's' : ''} ${missing.join(', ')}.` : 'You have answered every question.'} ${REDO ? '' : 'Any wrong answers come back to you to redo.'}</p>
    <div style="display:flex;flex-direction:column;gap:8px"><button class="btn" id="dGo">Submit</button><button class="btn ghost" id="dNo">Keep working</button></div>`;
  d.showModal();
  $('#dNo').onclick = () => { d.close(); if (missing.length) { cur = list().findIndex(q => q.ix === missing[0] - 1); drawQ(); } };
  $('#dGo').onclick = async () => {
    $('#dGo').disabled = true; const r = await call({ action: 'submit', code: CODE, token: TOKEN }); d.close();
    if (!r.ok && r.status !== 409) return alert(r.error || 'Not submitted. Try again.');
    if (r.redo && r.redo.length) {
      REDO = r.redo; r.redo.forEach(ix => delete ANS[ix]); cur = 0;
      $('#m').innerHTML = `<div class="top">${brand}<span class="grow"></span><span class="time" id="left"></span></div><div class="center"><div class="big">${r.redo.length} to redo</div>
        <p class="muted">${r.redo.length === 1 ? 'One answer isn\u2019t right' : r.redo.length + ' answers aren\u2019t right'}: question${r.redo.length === 1 ? '' : 's'} ${r.redo.map(i => i + 1).join(', ')}. Have another go at ${r.redo.length === 1 ? 'it' : 'those'}, then submit again.</p>
        <button class="btn" id="goRedo">Start</button></div>`;
      $('#goRedo').onclick = () => drawQ();
      return;
    }
    view = ''; poll();
  };
}
start();
</script>
</body>
</html>
