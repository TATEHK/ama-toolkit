# Keeps the free Supabase project from pausing by making a small request every 3 days.
# Reads the project URL and public key from site/config.js.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 21 */3 * *"   # every 3 days, early morning Sydney time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" site/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" site/config.js)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/" -H "apikey: $KEY")
          echo "Supabase answered with HTTP $STATUS"
          [ "$STATUS" -lt 500 ]
